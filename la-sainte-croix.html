<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KT 6e · La Sainte Croix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1D2452;--gold:#F0B429;--red:#C7372F;
  --bg:#EEF3FF;--card:#FFFFFF;--ink:#171B3B;--head:#1D2452;--muted:#535A85;--line:#CFD8F3;
  --ok:#1B7F53;--ok-bg:#DAF3E6;--bad:#B5312A;--bad-bg:#FBE0DD;--warn:#7A5300;--warn-bg:#FFF0CC;
  --btn:#1D2452;--btn-ink:#FFFFFF;--focus:#2E5BFF;
  --sky:#DCE8FF;--ground:#B9C8EE;--wall:#F7EEDA;--roof:#7C4A3A;--door:#3A2F5E;
  --accent:#F0B429;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1330;--card:#181E4A;--ink:#EEF0FF;--head:#EEF0FF;--muted:#A9B0DA;--line:#2E3766;
    --ok:#63D9A2;--ok-bg:#12382B;--bad:#FF9A93;--bad-bg:#40191A;--warn:#FFD37A;--warn-bg:#3F3110;
    --btn:#F0B429;--btn-ink:#1D2452;--focus:#8FB0FF;
    --sky:#1B2456;--ground:#232C66;--wall:#E9DDC0;--roof:#A8665A;--door:#0F1330;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1330;--card:#181E4A;--ink:#EEF0FF;--head:#EEF0FF;--muted:#A9B0DA;--line:#2E3766;
  --ok:#63D9A2;--ok-bg:#12382B;--bad:#FF9A93;--bad-bg:#40191A;--warn:#FFD37A;--warn-bg:#3F3110;
  --btn:#F0B429;--btn-ink:#1D2452;--focus:#8FB0FF;
  --sky:#1B2456;--ground:#232C66;--wall:#E9DDC0;--roof:#A8665A;--door:#0F1330;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 'Nunito',system-ui,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;color:var(--head);line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.hs:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Header */
.top{background:var(--night);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font:800 1.05rem 'Baloo 2',sans-serif;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--gold)}
.parts{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.parts::-webkit-scrollbar{display:none}
.parts button{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.parts button.on{background:var(--gold);border-color:var(--gold);color:#1D2452}
.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.ghost[aria-pressed="true"]{background:#fff;color:#1D2452}
.bar{height:5px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

/* Stage */
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:26px 20px 110px}
.slide{border-left:8px solid var(--accent);padding-left:clamp(14px,3vw,30px)}
.slide.part0{--accent:#F0B429}.slide.part1{--accent:#C7372F}.slide.part2{--accent:#3A57C8}.slide.part3{--accent:#1B9A63}.slide.part4{--accent:#F0B429}
.slide>h1{font-size:clamp(1.7rem,3.8vw,2.7rem);margin-bottom:14px}
.lead{font-size:1.2rem;max-width:62ch;margin:0 0 18px}
.hint{color:var(--muted);font-size:.95rem}
.verse{margin:18px 0;padding:14px 18px;background:var(--card);border-left:5px solid var(--gold);border-radius:0 12px 12px 0;font-size:1.15rem;font-style:italic;max-width:64ch}
.verse cite{display:block;font-style:normal;font-weight:800;font-size:.9rem;color:var(--muted);margin-top:4px}
.notes{display:none;margin-top:28px;padding:14px 18px;background:var(--warn-bg);color:var(--warn);border-radius:12px;font-size:.98rem;max-width:80ch}
.notes b{display:block;margin-bottom:4px}
body.notes-on .notes{display:block}

/* Footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;z-index:20}
.foot button{border:2px solid var(--btn);background:transparent;color:var(--head);border-radius:12px;padding:8px 22px;font-weight:800;min-width:130px}
.foot button.primary{background:var(--btn);color:var(--btn-ink)}
.foot button:disabled{opacity:.35;cursor:default}
#count{color:var(--muted);font-weight:700}
.primary{background:var(--btn);color:var(--btn-ink);border:2px solid var(--btn);border-radius:12px;padding:8px 22px;font-weight:800}
.big{font-size:1.2rem;padding:12px 28px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:clamp(18px,4vw,44px);align-items:center}
.hero-cross{background:var(--night);color:var(--gold);border-radius:28px;padding:34px;aspect-ratio:1}
.hero-cross svg{width:100%;height:100%}
.hero-title{font-size:clamp(2.4rem,7vw,4.6rem);margin-bottom:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.trio div{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.trio b{display:block;color:var(--head);font-family:'Baloo 2',sans-serif;font-size:1.1rem}
.trio span{font-size:.92rem;color:var(--muted)}

/* Reveal cards */
.grid{display:grid;gap:14px;align-items:start}
.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.rcard{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;transition:border-color .15s,background .15s}
.rcard:hover{border-color:var(--accent)}
.rcard .ic{font-size:1.7rem;line-height:1}
.rcard .rt{font:800 1.12rem 'Baloo 2',sans-serif;color:var(--head)}
.rcard .more{display:none;font-size:1rem;color:var(--ink)}
.rcard.open{border-color:var(--accent)}
.rcard.open .more{display:block}
.rcard.open.ok{background:var(--ok-bg);border-color:var(--ok)}
.rcard.open.bad{background:var(--bad-bg);border-color:var(--bad)}
.rcard.open.warn{background:var(--warn-bg);border-color:var(--warn)}
.counter{color:var(--muted);font-weight:700;margin:12px 0 0;font-size:.95rem}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.match .col{display:flex;flex-direction:column;gap:10px}
.mcard{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700}
.mcard.alt{font-weight:400}
.mcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.45)}
.mcard.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ink);cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin:16px 0 0;padding:12px 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);min-height:52px;max-width:80ch}
.fb.good{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.panel{margin-top:20px;padding:18px 20px;background:var(--card);border:2px solid var(--ok);border-radius:16px}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.panel .two div{background:var(--bg);border-radius:12px;padding:10px 14px}

/* Timer */
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:24px;margin:10px 0 16px}
.clock{font:800 clamp(4rem,12vw,7.5rem) 'Baloo 2',sans-serif;color:var(--head);min-width:2.4ch;text-align:center;line-height:1}
.clock.run{color:var(--red)}.clock.end{color:var(--ok);font-size:clamp(3rem,8vw,5rem)}
.tbtns{display:flex;flex-direction:column;gap:10px}
.tbtns button:not(.primary){border:2px solid var(--btn);background:transparent;color:var(--head);border-radius:12px;padding:8px 22px;font-weight:800}
.tally{font-size:1.3rem;margin:0}

/* Verse game */
.built{min-height:3.4rem;font:800 clamp(1.3rem,3vw,1.9rem) 'Baloo 2',sans-serif;color:var(--head);background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px 18px;margin:0 0 16px}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 20px;font-weight:800;font-size:1.1rem}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip:disabled{opacity:.25;cursor:default}

/* Church scene */
.scene{width:100%;height:auto;max-height:58vh;border-radius:18px;border:2px solid var(--line);display:block;background:var(--sky)}
.hs{cursor:pointer}
.hs circle{fill:var(--gold);stroke:var(--night);stroke-width:2.5}
.hs text{font:800 20px 'Nunito',sans-serif;fill:#1D2452;pointer-events:none}
.hs:not(.found) circle{animation:pulse 1.8s ease-in-out infinite}
.hs.found circle{fill:#1B7F53;stroke:#fff}
.hs.found text{fill:#fff}
.hs:focus-visible circle{stroke:var(--focus);stroke-width:5}
@keyframes pulse{50%{stroke-width:7}}
.reveal{margin-top:14px;padding:14px 18px;background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:96px;max-width:80ch}
.reveal h3{font-size:1.2rem;margin-bottom:4px}

/* Coin */
.coin{display:block;width:min(100%,640px);min-height:250px;background:none;border:0;padding:0;perspective:1200px}
.coin-in{position:relative;width:100%;min-height:250px;transition:transform .6s;transform-style:preserve-3d}
.coin.flip .coin-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px 26px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:8px}
.face h2{color:inherit;font-size:1.9rem}
.face p{margin:0;font-size:1.1rem}
.face small{opacity:.85;font-weight:700}
.f1{background:#FFE9A8;color:#3E2D00}
.f2{background:#2C3878;color:#fff;transform:rotateY(180deg)}

/* Quiz */
.qbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}
.toggle{display:flex;gap:8px;align-items:center;font-weight:700}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.teams{display:flex;gap:18px;flex-wrap:wrap}
.teams div{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:4px 12px}
.teams button{width:34px;height:34px;border-radius:50%;border:2px solid var(--btn);background:transparent;color:var(--head);font-weight:800}
.teams output{font:800 1.5rem 'Baloo 2',sans-serif;min-width:1.5ch;text-align:center}
.qn{color:var(--muted);font-weight:700;margin:0 0 4px}
.qq{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:900px}
.choice{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-weight:700}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice.right{background:var(--ok-bg);border-color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.score{font:800 clamp(3rem,10vw,6rem) 'Baloo 2',sans-serif;color:var(--head);line-height:1}

/* Challenge */
.todo{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px;max-width:720px}
.todo label{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;font-weight:700}
.todo input{width:24px;height:24px;accent-color:#1B9A63;flex:none}
.todo label:has(input:checked){background:var(--ok-bg);border-color:var(--ok)}

@media (max-width:820px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr}
  .hero-cross{max-width:200px}
  .trio,.grid.c3,.grid.c4,.match,.choices,.panel .two{grid-template-columns:1fr}
  .grid.c2{grid-template-columns:1fr}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand"><span>KT · 6e · La Sainte Croix</span></div>
  <nav class="parts" id="parts" aria-label="Parties du cours"></nav>
  <button class="ghost" id="notesBtn" aria-pressed="false" title="Touche N">Notes serviteur</button>
</header>
<div class="bar"><i id="bar"></i></div>
<main id="stage" aria-live="polite"></main>
<footer class="foot">
  <button id="prev">Précédent</button>
  <span id="count"></span>
  <button id="next" class="primary">Suivant</button>
</footer>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const CROSS=`<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="currentColor"><rect x="50" y="20" width="20" height="80" rx="5"/><rect x="20" y="50" width="80" height="20" rx="5"/>
<circle cx="50" cy="12" r="4"/><circle cx="60" cy="8" r="4"/><circle cx="70" cy="12" r="4"/>
<circle cx="50" cy="108" r="4"/><circle cx="60" cy="112" r="4"/><circle cx="70" cy="108" r="4"/>
<circle cx="12" cy="50" r="4"/><circle cx="8" cy="60" r="4"/><circle cx="12" cy="70" r="4"/>
<circle cx="108" cy="50" r="4"/><circle cx="112" cy="60" r="4"/><circle cx="108" cy="70" r="4"/></g></svg>`;
$('#brand').insertAdjacentHTML('afterbegin',CROSS);

const PARTS=['Départ','Pourquoi la Croix ?','Dans l’église','Dans ma vie','Bilan'];
const slides=[];
const add=(part,title,notes,build)=>slides.push({part,title,notes,build});
let idx=0,cleanups=[];

/* ---------- Composants ---------- */
function revealGrid(host,items,cols=3){
  const grid=el('div','grid c'+cols);const seen=new Set();
  const cnt=el('p','counter');
  const upd=()=>cnt.innerHTML=`Découvert : <b>${seen.size}</b> / ${items.length}`;
  items.forEach((it,i)=>{
    const b=el('button','rcard'+(it.tone?' '+it.tone:''),`<span class="ic" aria-hidden="true">${it.icon||''}</span><span class="rt">${it.t}</span><span class="more">${it.b}</span>`);
    b.setAttribute('aria-expanded','false');
    b.onclick=()=>{const o=b.classList.toggle('open');b.setAttribute('aria-expanded',String(o));if(o){seen.add(i);upd();}};
    grid.appendChild(b);
  });
  upd();host.append(grid,cnt);
}

function matchGame(host,pairs,opt={}){
  const wrap=el('div','match');const L=el('div','col'),R=el('div','col');
  const fb=el('p','fb','Choisis une carte à gauche, puis sa réponse à droite.');
  let sel=null,done=0;
  const lefts=pairs.map((p,i)=>{const b=el('button','mcard',p.l);b.dataset.i=i;return b;});
  const rights=shuffle(pairs.map((p,i)=>({i,r:p.r}))).map(o=>{const b=el('button','mcard alt',o.r);b.dataset.i=o.i;return b;});
  lefts.forEach(b=>{b.onclick=()=>{
    if(b.classList.contains('done'))return;
    lefts.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;
    fb.textContent='Maintenant, trouve la bonne réponse à droite.';fb.className='fb';
  };L.appendChild(b);});
  rights.forEach(b=>{b.onclick=()=>{
    if(b.classList.contains('done'))return;
    if(sel===null){fb.textContent='Commence par choisir une carte à gauche.';return;}
    if(+b.dataset.i===sel){
      b.classList.add('done');lefts[sel].classList.remove('sel');lefts[sel].classList.add('done');
      fb.innerHTML=`<b>Bravo !</b> ${pairs[sel].why||''}`;fb.className='fb good';sel=null;done++;
      if(done===pairs.length&&opt.onDone)opt.onDone();
    }else{
      b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);
      fb.textContent='Pas tout à fait… essaie une autre carte !';fb.className='fb bad';
    }
  };R.appendChild(b);});
  wrap.append(L,R);host.append(wrap,fb);
}

function quiz(host,qs){
  let i=0,score=0,answered=false;const t={a:0,b:0};
  const bar=el('div','qbar');
  const tg=el('label','toggle','<input type="checkbox"> Jouer en équipes');
  const tm=el('div','teams');tm.hidden=true;
  tm.innerHTML=['a','b'].map((k,n)=>`<div><b>Équipe ${n+1}</b><button data-t="${k}" data-d="-1" aria-label="Retirer un point à l’équipe ${n+1}">−</button><output>0</output><button data-t="${k}" data-d="1" aria-label="Ajouter un point à l’équipe ${n+1}">+</button></div>`).join('');
  tm.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.t;t[k]=Math.max(0,t[k]+ +b.dataset.d);b.parentElement.querySelector('output').textContent=t[k];};
  tg.querySelector('input').onchange=e=>{tm.hidden=!e.target.checked;};
  bar.append(tg,tm);
  const box=el('div','qbox');host.append(bar,box);
  function show(){
    answered=false;box.innerHTML='';
    if(i>=qs.length){end();return;}
    const q=qs[i];
    box.append(el('p','qn',`Question ${i+1} sur ${qs.length}`),el('h2','qq',q.q));
    const list=el('div','choices');const btns=[];
    shuffle(q.c.map((c,k)=>k)).forEach(k=>{
      const b=el('button','choice',q.c[k]);btns[k]=b;
      b.onclick=()=>{
        if(answered)return;answered=true;const ok=k===q.a;if(ok)score++;
        b.classList.add(ok?'right':'wrong');btns[q.a].classList.add('right');
        fb.innerHTML=`<b>${ok?'Bravo !':'Pas tout à fait.'}</b> ${q.why}`;fb.className='fb '+(ok?'good':'bad');
        nxt.hidden=false;nxt.textContent=i===qs.length-1?'Voir le résultat':'Question suivante';
      };
      list.appendChild(b);
    });
    const fb=el('p','fb','Choisis ta réponse.');
    const nxt=el('button','primary','Question suivante');nxt.hidden=true;nxt.style.marginTop='14px';
    nxt.onclick=()=>{i++;show();};
    box.append(list,fb,nxt);
  }
  function end(){
    const msg=score>=9?'Champions de la Croix ! 🏆':score>=6?'Très bien, vous avez retenu l’essentiel !':'On révise ensemble et on refait un tour !';
    box.innerHTML=`<p class="qn">Résultat</p><div class="score">${score} / ${qs.length}</div><h2 class="qq" style="margin-top:12px">${msg}</h2>`;
    const again=el('button','primary','Rejouer');again.onclick=()=>{i=0;score=0;show();};box.appendChild(again);
  }
  show();
}

/* ---------- Diapositives ---------- */
add(0,null,`<p>Durée conseillée : 50 à 60 min (Départ 8 · Pourquoi la Croix ? 25 · Dans l’église 10 · Dans ma vie 8 · Bilan 8). Si le temps manque, saute « La mort à 4 visages » et « saint Athanase ».</p><p>Astuce : flèches ← → du clavier pour naviguer, touche N pour afficher ou masquer ces notes.</p>`,root=>{
  root.innerHTML=`<div class="hero"><div class="hero-cross">${CROSS}</div><div>
    <h1 class="hero-title">La Sainte Croix</h1>
    <p class="lead">En 326, la reine Hélène découvrait le bois de la Sainte Croix. Cette année, ça fait 1700 ans : toute l’Église en parle, et nous aussi !</p>
    <blockquote class="verse">« Nous sommes plus que vainqueurs par Celui qui nous a aimés »<cite>Romains 8:37</cite></blockquote>
    <div class="trio"><div><b>Pourquoi la Croix ?</b><span>Ce que Jésus a fait pour nous</span></div><div><b>Dans l’église</b><span>Où on la voit, quand on la fête</span></div><div><b>Dans ma vie</b><span>Les épreuves et la joie</span></div></div>
  </div></div>`;
});

add(0,'Défi éclair : 30 secondes !',`<p>Note au tableau les idées des enfants : on y revient à la fin de la partie « Dans l’église ». Un enfant compte à voix haute, ou clique sur +1 à chaque idée.</p>`,root=>{
  root.innerHTML=`<p class="lead">Où as-tu déjà vu une croix ? À la maison, à l’église, dans la rue… Cite-en le plus possible !</p>
  <div class="timer"><div class="clock" id="clk">30</div><div class="tbtns"><button class="primary big" id="go">Lancer le chrono</button><button id="plus">+1 idée</button></div><p class="tally">Idées trouvées : <b id="tally">0</b></p></div>
  <p class="hint">On vérifiera à la fin de la partie « Dans l’église » s’il vous en manquait.</p>`;
  const clk=$('#clk',root);let t=null,left=30,n=0;
  $('#go',root).onclick=()=>{clearInterval(t);left=30;clk.textContent=left;clk.className='clock run';
    t=setInterval(()=>{left--;clk.textContent=left>0?left:'Stop !';if(left<=0){clearInterval(t);clk.className='clock end';}},1000);};
  $('#plus',root).onclick=()=>{$('#tally',root).textContent=++n;};
  cleanups.push(()=>clearInterval(t));
});

add(0,'Reconstruis le verset',`<p>Laisse un enfant venir taper les mots. Puis demande : « Qui est Celui qui nous a aimés ? » (Jésus, mort sur la Croix). C’est le verset du thème de cette année.</p>`,root=>{
  const words='Nous sommes plus que vainqueurs par Celui qui nous a aimés'.split(' ');
  root.innerHTML=`<p class="lead">Les mots sont mélangés. Touche-les dans le bon ordre !</p><p class="built" id="built" aria-live="polite"></p><div class="bank" id="bank"></div><div id="win" hidden><div class="fb good" style="margin-top:16px"><b>Bravo !</b> C’est Romains 8:37. Et qui est « Celui qui nous a aimés » ? C’est Jésus, qui est mort pour nous sur la Croix.</div></div><p style="margin-top:14px"><button id="mix" class="primary">Recommencer</button></p>`;
  const built=$('#built',root),bank=$('#bank',root),win=$('#win',root);let pos;
  function setup(){
    built.textContent='';bank.innerHTML='';win.hidden=true;pos=0;
    shuffle(words).forEach(w=>{
      const b=el('button','chip',w);
      b.onclick=()=>{
        if(w===words[pos]){b.disabled=true;built.textContent+=(pos?' ':'')+w;pos++;if(pos===words.length){built.textContent='« '+built.textContent+' »';win.hidden=false;}}
        else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);}
      };
      bank.appendChild(b);
    });
  }
  $('#mix',root).onclick=setup;setup();
});

add(1,'Le grand problème',`<p>Raconte plutôt que lire. Demande : « Pourquoi Dieu n’a-t-il pas simplement dit que ce n’était pas grave ? » On garde la question pour la diapo suivante.</p>`,root=>{
  root.innerHTML=`<p class="lead">Dieu avait dit à Adam et Ève : « Ne mangez pas de l’arbre interdit. » Ils en ont mangé… Et alors ?</p><div id="g"></div><blockquote class="verse">« Car le salaire du péché, c’est la mort »<cite>Romains 6:23</cite></blockquote>`;
  revealGrid($('#g',root),[
    {icon:'⚖️',t:'La sentence',b:'Ils méritent la mort : c’est la conséquence du péché.'},
    {icon:'💔',t:'La nature abîmée',b:'Leur nature sainte s’est corrompue : le péché a abîmé l’être humain de l’intérieur.'},
    {icon:'👨‍👩‍👧‍👦',t:'Pour tous les humains',b:'Nous avons hérité du péché originel et de cette nature abîmée.'}
  ],3);
});

add(1,'Comment Dieu peut-Il nous sauver ?',`<p>Fais voter à main levée A, B ou C avant de révéler. Idée clé : Dieu est amour ET juste, et les deux doivent être respectés.</p>`,root=>{
  root.innerHTML=`<p class="lead">Dieu est plein d’amour et Il est juste. Voici trois solutions possibles : touche chacune pour voir si elle marche.</p><div id="g"></div>`;
  revealGrid($('#g',root),[
    {icon:'A',tone:'bad',t:'Adam et Ève meurent, et c’est tout',b:'❌ Où serait l’amour de Dieu ? Il aurait créé l’homme pour qu’il tombe et meure ! Et si Dieu créait un nouvel Adam, le Diable pourrait aussi le tromper… et ainsi de suite.'},
    {icon:'B',tone:'warn',t:'Dieu pardonne simplement',b:'⚠️ Où serait la justice ? Dieu avait prévenu qu’ils mourraient. Et même pardonnée, leur nature abîmée continuerait à produire des péchés.'},
    {icon:'C',tone:'ok',t:'Quelqu’un meurt à leur place',b:'✅ C’est la Rédemption ! La justice reçoit son dû quand le Rédempteur meurt, et nous recevons la miséricorde : nous sommes sauvés et notre nature est renouvelée.'}
  ],3);
});

add(1,'Portrait-robot du Rédempteur',`<p>À faire en équipes : une équipe choisit à gauche, l’autre à droite. Insiste sur Nasout (humanité) et Lahout (divinité) : les enfants les entendent à l’église.</p>`,root=>{
  root.innerHTML=`<p class="lead">Qui peut nous sauver ? Associe chaque qualité à sa raison.</p><div id="m"></div><div id="end"></div>`;
  matchGame($('#m',root),[
    {l:'Il doit être homme',r:'car c’est l’homme qui a péché.',why:'C’est l’homme qui a péché, donc c’est un homme qui doit racheter.'},
    {l:'Il doit mourir',r:'car le salaire du péché, c’est la mort.',why:'La sentence doit être accomplie.'},
    {l:'Il doit être illimité',r:'car le péché d’Adam est dirigé contre Dieu, l’Illimité.',why:'Seul quelqu’un d’illimité peut payer pour un péché contre Dieu.'},
    {l:'Il doit être sans péché',r:'car celui qui n’a pas une chose ne peut pas la donner.',why:'Pour nous donner la sainteté, il doit la posséder.'},
    {l:'Il doit être Créateur',r:'pour renouveler notre nature abîmée et la recréer.',why:'Seul le Créateur peut nous recréer.'}
  ],{onDone(){
    $('#end',root).innerHTML=`<div class="panel"><b>Une seule personne réunit tout : Jésus-Christ, Dieu le Verbe fait homme. Emmanuel = « Dieu avec nous » !</b><div class="two"><div><b>Nasout (son humanité)</b><br>Il peut mourir.</div><div><b>Lahout (sa divinité)</b><br>Il est illimité, sans péché et Créateur.</div></div><p style="margin-bottom:0">Après sa mort sur la Croix, sa divinité a ressuscité son humanité, et Il nous a ressuscités avec Lui.</p></div>`;
  }});
});

add(1,'Le signe de la croix : un mini-cours de foi',`<p>Fais le signe de la croix ensemble, lentement, avant de découvrir les cartes.</p><p>Le document du cours décrit le mouvement « de haut en bas » (Dieu descend du ciel) puis « de la gauche vers la droite » (des ténèbres à la lumière). Adapte la formulation à la façon dont tes enfants font le signe à l’église.</p>`,root=>{
  root.innerHTML=`<p class="lead">Chaque fois que tu fais le signe de la croix, tu dis beaucoup de choses. Découvre-les !</p><div id="g"></div>`;
  revealGrid($('#g',root),[
    {icon:'☘️',t:'La Trinité',b:'Au nom du Père, du Fils et du Saint-Esprit, un seul Dieu.'},
    {icon:'⬇️',t:'Dieu est descendu',b:'Le mouvement de haut en bas rappelle que Dieu est descendu du ciel, et le passage d’un côté à l’autre, que Jésus nous fait passer des ténèbres à la lumière.'},
    {icon:'❤️',t:'Il m’aime',b:'Il a accepté la mort sur la Croix par amour pour moi.'},
    {icon:'🎒',t:'Il a porté mes péchés',b:'« Lui qui a porté lui-même nos péchés en son corps » (1 Pierre 2:24).'},
    {icon:'🙋',t:'J’appartiens à Jésus',b:'Je montre ma foi avec fierté : « Loin de moi la pensée de me glorifier d’autre chose que de la croix » (Galates 6:14).'},
    {icon:'🏷️',t:'Le signe des croyants',b:'C’est le signe de mon Sauveur : on reconnaît ceux qui suivent le Christ.'},
    {icon:'🤝',t:'La réconciliation',b:'La Croix est le signe de la paix entre Dieu et les hommes.'},
    {icon:'💪',t:'Une force',b:'Il y a une bénédiction et une puissance dans ce signe : la croix « est une puissance de Dieu » (1 Corinthiens 1:18).'}
  ],4);

add(1,'Pourquoi la Croix, et pas autre chose ?',`<p>Trois raisons à raconter avec les versets. Avec des enfants plus jeunes, reste sur l’idée : Jésus a pris à notre place la malédiction, la mort, et Il a payé de son sang.</p>`,root=>{
  root.innerHTML=`<p class="lead">Jésus aurait pu être sauvé autrement ? Non : la Croix était nécessaire, pour trois raisons.</p><div id="g"></div>`;
  revealGrid($('#g',root),[
    {icon:'🌿',t:'Enlever la malédiction',b:'À cause du péché, la terre était maudite (épines, sueur…). Or « celui qui est pendu est maudit » (Deutéronome 21:23). Jésus a accepté la croix pour porter la malédiction à notre place (Galates 3:13).'},
    {icon:'🛡️',t:'Porter la sentence de mort',b:'La mort promise à Adam avait plusieurs visages (voir la diapo suivante). Sur la Croix, Jésus a tout porté à notre place. Sa divinité unie à son humanité a été plus forte que la mort !'},
    {icon:'🩸',t:'Verser son sang',b:'« Sans effusion de sang il n’y a pas de pardon » (Hébreux 9:22). Sur la Croix, le sang de Jésus a coulé pour nous : couronne d’épines, fouet, lance et clous.'}
  ],3);
});

    {icon:'🩺',t:'La mort du corps',b:'La corruption est entrée dans notre nature humaine.'},
    {icon:'🔌',t:'La mort spirituelle',b:'Nous nous sommes séparés de Dieu : plus de communion avec Lui.'},
    {icon:'🚪',t:'La mort morale',b:'Chassés du jardin d’Éden, nous sommes devenus fragiles et humiliés, nous qui portons l’image de Dieu.'},
    {icon:'♾️',t:'La mort éternelle',b:'Perdre pour toujours la vie avec Dieu. Jésus a écrasé tout cela pour nous !'}
  ],4);
});

  <svg class="scene" viewBox="0 0 800 420" role="group" aria-label="Scène avec une église, un autel, une table et un enfant">

    <path d="M305 380v-45a25 25 0 0 1 50 0v45z" fill="var(--door)"/>
    <circle cx="70" cy="300" r="20" fill="#E0B48C"/><rect x="48" y="322" width="44" height="58" rx="14" fill="#3A57C8"/>

    <rect x="545" y="335" width="100" height="45" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <path d="M595 296v34M583 308h24" stroke="#F0B429" stroke-width="6" stroke-linecap="round"/>
    <rect x="668" y="352" width="110" height="9" rx="3" fill="var(--roof)"/><rect x="678" y="361" width="8" height="19" fill="var(--roof)"/><rect x="760" y="361" width="8" height="19" fill="var(--roof)"/>
    <circle cx="700" cy="343" r="10" fill="#E0B058"/><path d="M732 352l-3-22h18l-3 22z" fill="#8FB0FF"/>
    ${HS.map((h,i)=>`<g class="hs" data-i="${i}" tabindex="0" role="button" aria-label="Indice ${i+1}"><circle cx="${h.x}" cy="${h.y}" r="17"/><text x="${h.x}" y="${h.y+7}" text-anchor="middle">?</text></g>`).join('')}
  </svg>
  <div class="reveal" id="rv" aria-live="polite"><p class="hint" style="margin:0">Touche un « ? » pour commencer.</p></div>
  <p class="counter" id="cn">Trouvé : <b>0</b> / ${HS.length}</p>`;
  const found=new Set(),rv=$('#rv',root);
  const pick=g=>{
    const i=+g.dataset.i,h=HS[i];found.add(i);g.classList.add('found');g.querySelector('text').textContent='✓';
    rv.innerHTML=`<h3>${h.t}</h3><p style="margin:0">${h.b}</p>`;
    $('#cn',root).innerHTML=`Trouvé : <b>${found.size}</b> / ${HS.length}`+(found.size===HS.length?' — Bravo, tu as tout trouvé !':'');
  };
  const svg=$('.scene',root);
  svg.addEventListener('click',e=>{const g=e.target.closest('.hs');if(g)pick(g);});
  svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.hs');if(g){e.preventDefault();pick(g);}}});
});

add(2,'Deux fêtes pour la Croix',`<p>Si possible, chantez ensemble un hymne de la Croix. Les dates sont celles du calendrier copte : 17 Tout et 10 Baramhat.</p>`,root=>{
  root.innerHTML=`<p class="lead">L’Église fête la Croix deux fois par an, en plus de la Semaine Sainte et du Vendredi Saint. Associe chaque fête à son histoire.</p><div id="m"></div>
  <h2 style="margin:26px 0 12px;font-size:1.5rem">On chante et on prie la Croix</h2><div id="g"></div>`;
  matchGame($('#m',root),[
    {l:'Le 17 Tout',r:'On commémore la dédicace de l’église de la Résurrection à Jérusalem et la consécration de la Croix à l’endroit qui lui est dédié.',why:'La fête de la dédicace de l’église de la Résurrection.'},
    {l:'Le 10 Baramhat',r:'On fête la découverte de la glorieuse Croix par la reine sainte Hélène, en l’an 326.',why:'La découverte de la Croix par sainte Hélène, il y a 1700 ans !'}
  ]);
  revealGrid($('#g',root),[
    {icon:'🎶',t:'Les hymnes',b:'« Nous nous prosternons devant Ta croix », « Le bois vivifiant », « La croix est notre fierté »…'},
    {icon:'📖',t:'La doxologie de la fête',b:'Nous y proclamons notre foi en la Croix, signe de rédemption et de réconciliation avec Dieu.'},
    {icon:'🕊️',t:'La psalie du vendredi',b:'Nous disons que Dieu a donné un signe à ceux qui Le craignent : le nom du salut et la Croix vivifiante sur laquelle Il a été crucifié.'}
  ],3);
});

add(3,'Les deux faces de la croix',`<p>Retourne la carte plusieurs fois. Le chrétien vit les deux ensemble : la joie du salut ET l’endurance des épreuves.</p>`,root=>{
  root.innerHTML=`<p class="lead">Comme une pièce, la croix a deux faces. Touche la carte pour la retourner.</p>
  <button class="coin" id="coin" aria-label="Retourner la carte"><div class="coin-in">
    <div class="face f1"><h2>Face 1 : la joie</h2><p>Le salut, la résurrection de Jésus et sa victoire pour nous.</p><small>« En vue de la joie qui Lui était réservée, Il a souffert la croix » (Hébreux 12:2)</small></div>
    <div class="face f2"><h2>Face 2 : l’endurance</h2><p>Les épreuves et les peines qu’on traverse avec Jésus.</p><small>« Je me réjouis maintenant dans mes souffrances pour vous » (Colossiens 1:24)</small></div>

  <p class="lead" style="margin-top:18px">Le chrétien vit les deux ensemble : dans les épreuves, il garde la joie de Jésus.</p>`;

add(3,'Pourquoi Dieu permet-Il des épreuves ?',`<p>Fais discuter entre équipes avant chaque réponse. Rappelle que Dieu permet l’épreuve pour notre bien et ne nous abandonne pas.</p>`,root=>{
  root.innerHTML=`<p class="lead">Les épreuves de la vie ont des buts saints. Associe chaque personnage de la Bible au but de son épreuve.</p><div id="m"></div><p class="hint" style="margin-top:14px">Quand l’épreuve vient de Dieu et pas à cause de notre péché, la joie et la paix intérieure l’accompagnent.</p>`;
  matchGame($('#m',root),[
    {l:'Le fils prodigue (Luc 15)',r:'Pour ramener vers Dieu : la repentance',why:'Il se dit : « J’ai péché contre le ciel » et revient. Nous aussi, nous nous confessons et nous entendons : « Tes péchés te sont pardonnés ».'},
    {l:'Job',r:'Pour purifier',why:'Job était juste, mais Dieu l’a purifié de sa « justice propre » : « Mon œil T’a vu, je me repens » (Job 42:5-6).'},

    {l:'Paul et l’écharde',r:'Pour protéger de l’orgueil',why:'Pour qu’il ne s’enorgueillisse pas de ses révélations, Dieu a permis une écharde dans sa chair (2 Corinthiens 12:7).'}

});

    {icon:'♾️',t:'Vers l’éternité',b:'Du monde du périssable vers le monde de l’éternité.'}
  ],4);
});

  quiz(root,[
    {q:'« Nous sommes plus que … par Celui qui nous a aimés »',c:['vainqueurs','forts','courageux','sages'],a:0,why:'Romains 8:37, le verset du thème de cette année.'},
    {q:'Selon Romains 6:23, « le salaire du péché, c’est… »',c:['la mort','la tristesse','la peur','l’oubli'],a:0,why:'Le péché entraîne la mort : c’est pour cela qu’il fallait un Rédempteur.'},

add(4,'Ton défi de la semaine',`<p>Laisse chaque enfant cocher ce qu’il s’engage à faire. Termine par le signe de la croix et la prière habituelle de ta classe.</p>`,root=>{

  </ul>
  <p class="fb good" id="yes" hidden><b>Défi accepté !</b> « Nous sommes plus que vainqueurs par Celui qui nous a aimés ».</p>`;

/* ---------- Navigation ---------- */
function render(){
  cleanups.forEach(f=>f());cleanups=[];
  const s=slides[idx],stage=$('#stage');stage.innerHTML='';
  const sec=el('section','slide part'+s.part);
  if(s.title)sec.appendChild(el('h1','',s.title));
  const body=el('div','body');sec.appendChild(body);
  s.build(body);
  sec.appendChild(el('aside','notes','<b>Pour le serviteur</b>'+s.notes));
  stage.appendChild(sec);
  [...$('#parts').children].forEach((b,i)=>b.classList.toggle('on',i===s.part));
  $('#bar').style.width=((idx+1)/slides.length*100)+'%';
  $('#count').textContent=`${idx+1} / ${slides.length}`;
  $('#prev').disabled=idx===0;$('#next').disabled=idx===slides.length-1;
}
function go(n){idx=Math.max(0,Math.min(slides.length-1,n));render();window.scrollTo({top:0});}
PARTS.forEach((p,i)=>{const b=el('button','',p);b.onclick=()=>go(slides.findIndex(s=>s.part===i));$('#parts').appendChild(b);});
$('#prev').onclick=()=>go(idx-1);$('#next').onclick=()=>go(idx+1);
$('#notesBtn').onclick=e=>{const on=document.body.classList.toggle('notes-on');e.currentTarget.setAttribute('aria-pressed',String(on));};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(idx+1);
  else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.key==='n'||e.key==='N')$('#notesBtn').click();
});
render();
</script>
