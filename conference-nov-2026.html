/* ============================================================================
0. SÉCURITÉ CRYPTOGRAPHIQUE (MOT DE PASSE MAÎTRE)
   ============================================================================ */
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = (hash << 5) - hash + char;
    hash |= 0;
  }
  return hash.toString(36);
}

function getStoredHostHash() {
  return localStorage.getItem('coptic_host_pwd_hash_v2');
}

function setStoredHostHash(pwd) {
  localStorage.setItem('coptic_host_pwd_hash_v2', simpleHash(pwd));
}

let myTabSessionId = sessionStorage.getItem('coptic_tab_session_id');
if (!myTabSessionId) {
  myTabSessionId = 'host_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
  sessionStorage.setItem('coptic_tab_session_id', myTabSessionId);
}

let isHostAuthenticated = sessionStorage.getItem('coptic_host_authed') === 'true';
let activeRemoteHost = { id: null, lastSeen: 0 };
let authErrorMsg = "";

/* ============================================================================
1. ROUTAGE ET GESTION DES RÔLES (AVEC DÉCONNEXION JOUEUR)
   ============================================================================ */
const VALID_PLAYER_SLOTS = ['1A', '1B', '2A', '2B', '3A', '3B'];
const urlParams = new URLSearchParams(window.location.search);
const roleFromUrl = (urlParams.get('role') || '').toUpperCase();

let myRole = 'HOST';

if (VALID_PLAYER_SLOTS.includes(roleFromUrl)) {
  myRole = roleFromUrl;
  localStorage.setItem('coptic_locked_player_role', roleFromUrl);
} else {
  const lockedRole = localStorage.getItem('coptic_locked_player_role');
  if (lockedRole && VALID_PLAYER_SLOTS.includes(lockedRole) && urlParams.get('host') !== '1') {
    myRole = lockedRole;
    window.history.replaceState(null, '', `?role=${lockedRole}`);
  } else {
    myRole = 'HOST';
  }
}

function updateRoleBadgeAndButtons() {
  const badge = document.getElementById('role-badge');
  const hostLogoutBtn = document.getElementById('host-logout-btn');
  const hostResetBtn = document.getElementById('host-reset-btn');
  const playerLogoutBtn = document.getElementById('player-logout-btn');

  if (myRole === 'HOST') {
    badge.textContent = '🖥️ Écran Maître';
    if (playerLogoutBtn) playerLogoutBtn.classList.add('hidden');
    if (isHostAuthenticated) {
      if (hostLogoutBtn) hostLogoutBtn.classList.remove('hidden');
      if (hostResetBtn) hostResetBtn.classList.remove('hidden');
    } else {
      if (hostLogoutBtn) hostLogoutBtn.classList.add('hidden');
      if (hostResetBtn) hostResetBtn.classList.add('hidden');
    }
  } else {
    badge.textContent = `📱 Terminal ${myRole}`;
    if (hostLogoutBtn) hostLogoutBtn.classList.add('hidden');
    if (hostResetBtn) hostResetBtn.classList.add('hidden');
    if (playerLogoutBtn) playerLogoutBtn.classList.remove('hidden');
  }
}

function logoutPlayer() {
  if (!confirm(`Voulez-vous quitter le Terminal ${myRole} et revenir à l'accueil (Écran Maître) ?`)) return;
  localStorage.removeItem('coptic_locked_player_role');
  myRole = 'HOST';
  const cleanUrl = window.location.origin + window.location.pathname;
  window.history.replaceState(null, '', cleanUrl);
  announceHostLock('WHO_IS_HOST');
  render();
}

let state = loadPersistedState();

function loadPersistedState() {
  try {
    const saved = localStorage.getItem('coptic_conf_persisted_state_v2');
    if (saved) {
      return Object.assign({}, DEFAULT_STATE, JSON.parse(saved));
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function savePersistedState() {
  try {
    localStorage.setItem('coptic_conf_persisted_state_v2', JSON.stringify(state));
  } catch (e) {}
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

let currentDrawColor = '#0f172a';
let currentDrawWidth = 3;
let mqttClient = null;

const MQTT_BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
const MQTT_TOPIC_ROOM = "coptic/serviteurs/conf-nov-2026/room_v2";
const MQTT_TOPIC_STATE = "coptic/serviteurs/conf-nov-2026/retained_state_v2";
const MQTT_TOPIC_HOST_LOCK = "coptic/serviteurs/conf-nov-2026/host_lock_v2";

function initMqtt() {
  const badge = document.getElementById('conn-badge');
  try {
    if (mqttClient) {
      try { mqttClient.end(true); } catch (e) {}
    }
    badge.textContent = "Connexion...";
    badge.className = "text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";

    mqttClient = mqtt.connect(MQTT_BROKER_URL);
    mqttClient.on('connect', () => {
      badge.textContent = "🟢 En Ligne";
      badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      mqttClient.subscribe([MQTT_TOPIC_ROOM, MQTT_TOPIC_STATE, MQTT_TOPIC_HOST_LOCK]);

      if (myRole === 'HOST') {
        if (isHostAuthenticated) {
          announceHostLock('HEARTBEAT');
          broadcastState();
        } else {
          announceHostLock('WHO_IS_HOST');
        }
      } else {
        sendEvent('REQUEST_STATE', {});
      }
    });

    mqttClient.on('message', (topic, payload) => {
      try {
        const packet = JSON.parse(payload.toString());
        if (topic === MQTT_TOPIC_HOST_LOCK) {
          handleHostLockPacket(packet);
        } else {
          handleNetworkMessage(packet);
        }
      } catch (e) {}
    });

    mqttClient.on('error', () => {
      badge.textContent = "🔴 Erreur réseau";
    });
  } catch (e) {
    badge.textContent = "⚠️ Hors-ligne";
  }
}

/* ============================================================================
4. GESTION DU VERROU EXCLUSIF DE L'ÉCRAN MAÎTRE
   ============================================================================ */
function announceHostLock(action) {
  if (!mqttClient || !mqttClient.connected) return;
  const pkt = { action, hostId: myTabSessionId, ts: Date.now() };
  mqttClient.publish(MQTT_TOPIC_HOST_LOCK, JSON.stringify(pkt), { qos: 0, retain: action !== 'WHO_IS_HOST' });
}

function handleHostLockPacket(pkt) {
  if (!pkt) return;
  if (pkt.action === 'HEARTBEAT' && pkt.hostId !== myTabSessionId) {
    if (Date.now() - pkt.ts < 8000) {
      activeRemoteHost = { id: pkt.hostId, lastSeen: Date.now() };
      if (myRole === 'HOST' && !isHostAuthenticated) render();
    }
  } else if (pkt.action === 'RELEASE' && pkt.hostId === activeRemoteHost.id) {
    activeRemoteHost = { id: null, lastSeen: 0 };
    if (myRole === 'HOST' && !isHostAuthenticated) render();
  } else if (pkt.action === 'WHO_IS_HOST' && myRole === 'HOST' && isHostAuthenticated && pkt.hostId !== myTabSessionId) {
    announceHostLock('HEARTBEAT');
  }
}

function isAnotherHostCurrentlyActive() {
  return activeRemoteHost.id && activeRemoteHost.id !== myTabSessionId && (Date.now() - activeRemoteHost.lastSeen < 7500);
}

setInterval(() => {
  if (myRole === 'HOST') {
    if (isHostAuthenticated) {
      announceHostLock('HEARTBEAT');
    } else if (activeRemoteHost.id && Date.now() - activeRemoteHost.lastSeen >= 7500) {
      activeRemoteHost = { id: null, lastSeen: 0 };
      render();
    }
  }
}, 3000);

window.addEventListener('beforeunload', () => {
  if (myRole === 'HOST' && isHostAuthenticated) {
    announceHostLock('RELEASE');
  }
});

function verifyHostPassword(e) {
  if (e) e.preventDefault();
  if (isAnotherHostCurrentlyActive()) {
    authErrorMsg = "Un autre appareil est déjà connecté en tant qu'Écran Maître.";
    render();
    return;
  }
  const inputEl = document.getElementById('host-pwd-input');
  const pwd = inputEl ? inputEl.value : '';

  let storedHash = getStoredHostHash();
  if (!storedHash) {
    setStoredHostHash(pwd);
    storedHash = getStoredHostHash();
  }

  if (simpleHash(pwd) === storedHash) {
    authErrorMsg = "";
    isHostAuthenticated = true;
    sessionStorage.setItem('coptic_host_authed', 'true');
    announceHostLock('HEARTBEAT');
    broadcastState();
  } else {
    authErrorMsg = "Mot de passe incorrect.";
    render();
  }
}

function logoutHost() {
  announceHostLock('RELEASE');
  isHostAuthenticated = false;
  sessionStorage.removeItem('coptic_host_authed');
  render();
}

/* ============================================================================
5. SYNCHRONISATION RÉSEAU & PERSISTANCE
   ============================================================================ */
function sendEvent(type, data) {
  const packet = { type, data, sender: myRole, ts: Date.now() };
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(MQTT_TOPIC_ROOM, JSON.stringify(packet));
  }
}

function broadcastState() {
  savePersistedState();
  if (myRole === 'HOST' && isHostAuthenticated) {
    const packet = { type: 'STATE_SYNC', data: state, sender: 'HOST', ts: Date.now() };
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish(MQTT_TOPIC_STATE, JSON.stringify(packet), { qos: 0, retain: true });
    }
    render();
  }
}

function switchToFiestaVoting() {
  // Mélange aléatoire des 3 chaînes pour que l'ordre d'affichage ne révèle pas quelle équipe a écrit quel mot
  state.fiestaShuffledOrder = shuffleArray([1, 2, 3]);
  state.fiestaPhase = 'VOTING';
  broadcastState();
}

function handleNetworkMessage(packet) {
  if (!packet) return;
  const { type, data, sender } = packet;

  if (type === 'FORCE_GLOBAL_RESET') {
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    try { localStorage.removeItem('coptic_conf_persisted_state_v2'); } catch (e) {}
    clearCanvasUI();
    render();
    if (myRole !== 'HOST') {
      initMqtt();
    }
    return;
  }

  if (type === 'STATE_SYNC') {
    if (myRole !== 'HOST') {
      state = Object.assign({}, DEFAULT_STATE, data);
      savePersistedState();
      render();
    }
  } else if (type === 'DRAW_BATCH') {
    if (data.roundId === state.picRoundId) {
      drawBatchOnCanvas(data.segments);
    }
  } else if (type === 'CLEAR_CANVAS') {
    if (data.roundId === state.picRoundId) {
      clearCanvasUI();
    }
  } else if (myRole === 'HOST' && isHostAuthenticated) {
    if (type === 'REQUEST_STATE') {
      broadcastState();
    } else if (type === 'BUZZ') {
      if (!state.buzzedBy) {
        state.buzzedBy = { slot: data.slot, team: data.team, answer: data.answer || '' };
        if (state.timerEndAt && state.timerEndAt > Date.now()) {
          state.timerRemainingPaused = Math.ceil((state.timerEndAt - Date.now()) / 1000);
          state.timerEndAt = null;
        }
        broadcastState();
      }
    } else if (type === 'FIESTA_WORD') {
      const chain = state.fiestaChains[data.team];
      if (chain && chain.step < 4) {
        chain.history.push(data.word);
        chain.currentWord = data.word;
        chain.step += 1;
        if (state.fiestaChains[1].step >= 4 && state.fiestaChains[2].step >= 4 && state.fiestaChains[3].step >= 4) {
          switchToFiestaVoting();
          return;
        }
        broadcastState();
      }
    } else if (type === 'FIESTA_VOTE') {
      state.fiestaVotes[data.team] = data.guesses;
      broadcastState();
    } else if (type === 'UC_VOTE') {
      if (!state.ucVotingOpen) return;
      const currentArr = Array.isArray(state.ucVotes[data.team])
        ? [...state.ucVotes[data.team]]
        : (state.ucVotes[data.team] ? [state.ucVotes[data.team]] : []);
      const idx = currentArr.indexOf(data.targetSlot);
      if (idx >= 0) {
        currentArr.splice(idx, 1);
      } else {
        if (currentArr.length >= 2) currentArr.shift();
        currentArr.push(data.targetSlot);
      }
      state.ucVotes[data.team] = currentArr;
      broadcastState();
    } else if (type === 'VERSE_SUBMIT') {
      const exists = state.verseSubmissions.find(s => s.team === data.team);
      if (!exists) {
        const elapsed = ((Date.now() - state.verseStartTime) / 1000).toFixed(1);
        state.verseSubmissions.push({ team: data.team, text: data.text, time: elapsed + 's' });
        broadcastState();
      }
    }
  }
}

/* ============================================================================
6. CHRONOMÈTRE PERSISTANT (AVEC FONCTION PAUSE/REPRISE)
   ============================================================================ */
function startTimer(seconds) {
  state.timerEndAt = Date.now() + seconds * 1000;
  state.timerRemainingPaused = null;
  broadcastState();
}

function stopTimer() {
  state.timerEndAt = null;
  state.timerRemainingPaused = null;
  broadcastState();
}

function toggleTimerPause() {
  if (state.timerEndAt && state.timerEndAt > Date.now()) {
    state.timerRemainingPaused = Math.ceil((state.timerEndAt - Date.now()) / 1000);
    state.timerEndAt = null;
  } else if (state.timerRemainingPaused !== null) {
    state.timerEndAt = Date.now() + state.timerRemainingPaused * 1000;
    state.timerRemainingPaused = null;
  }
  broadcastState();
}

setInterval(() => {
  const box = document.getElementById('timer-box');
  const disp = document.getElementById('timer-display');
  if (!box || !disp) return;

  if (state.timerEndAt) {
    box.classList.remove('hidden');
    const rem = Math.max(0, Math.ceil((state.timerEndAt - Date.now()) / 1000));
    disp.textContent = rem + 's';
    if (rem === 0 && myRole === 'HOST' && isHostAuthenticated) {
      state.timerEndAt = null;
      savePersistedState();
      broadcastState();
    }
  } else if (state.timerRemainingPaused !== null && state.timerRemainingPaused !== undefined) {
    box.classList.remove('hidden');
    disp.textContent = state.timerRemainingPaused + 's (Pause)';
  } else {
    box.classList.add('hidden');
  }
}, 300);

function startGame(gameName, roundIdx = 0) {
  state.currentGame = gameName;
  state.roundIndex = Math.max(0, roundIdx);
  state.buzzedBy = null;
  state.revealed = false;
  state.timerEndAt = null;
  state.timerRemainingPaused = null;

  if (gameName === 'SYNAXAIRE') {
    state.clueStep = 0;
    startTimer(60);
  } else if (gameName === 'FIESTA') {
    const pack = GAME_DATA.fiesta[state.roundIndex % GAME_DATA.fiesta.length];
    state.fiestaPhase = 'WRITING';
    state.fiestaVotes = {};
    state.fiestaScored = false;
    state.fiestaShuffledOrder = shuffleArray([1, 2, 3]);
    [1, 2, 3].forEach((t, idx) => {
      state.fiestaChains[t] = { step: 0, target: pack.targets[idx], currentWord: "", history: [] };
    });
    startTimer(120);
  } else if (gameName === 'UNDERCOVER') {
    const pack = GAME_DATA.undercover[state.roundIndex % GAME_DATA.undercover.length];
    const slots = ['1A', '1B', '2A', '2B', '3A', '3B'];

    // Sélection de 2 Undercover dans 2 équipes différentes (4 Orthodoxes + 2 Undercover)
    const shuffledTeams = shuffleArray([1, 2, 3]);
    const ucSlot1 = shuffledTeams[0] + (Math.random() < 0.5 ? 'A' : 'B');
    const ucSlot2 = shuffledTeams[1] + (Math.random() < 0.5 ? 'A' : 'B');
    const ucSet = new Set([ucSlot1, ucSlot2]);

    state.ucAssignments = {};
    state.ucVotes = {};
    state.ucRevealed = false;
    state.ucVotingOpen = false;
    state.ucTourNumber = 1;

    slots.forEach(s => {
      const isUC = ucSet.has(s);
      state.ucAssignments[s] = { word: isUC ? pack.undercover : pack.orthodox, isUC };
    });

    // Ordre de parole aléatoire (en s'assurant que le 1er orateur est un Orthodoxe)
    let order = shuffleArray(slots);
    const firstOrthodoxIdx = order.findIndex(s => !ucSet.has(s));
    if (firstOrthodoxIdx > 0) {
      [order[0], order[firstOrthodoxIdx]] = [order[firstOrthodoxIdx], order[0]];
    }
    state.ucSpeakingOrder = order;
    state.ucCurrentSpeakerIdx = 0;

    startTimer(120);
  } else if (gameName === 'VERSES') {
    state.verseSubmissions = [];
    state.verseRevealedTeams = {};
    state.verseForceShowAll = false;
    state.verseStartTime = Date.now();
    startTimer(45);
  } else if (gameName === 'PICTIONARY') {
    const slots = ['1A', '2A', '3A', '1B', '2B', '3B'];
    state.picDrawerSlot = slots[state.roundIndex % slots.length];
    state.picPrompt = GAME_DATA.pictionary[state.roundIndex % GAME_DATA.pictionary.length];
    state.picRoundId = (state.picRoundId || 1) + 1;
    startTimer(90);
  }
  broadcastState();
}

function nextUndercoverSpeaker() {
  const order = state.ucSpeakingOrder || ['1A', '2A', '3A', '1B', '2B', '3B'];
  if (state.ucCurrentSpeakerIdx < order.length - 1) {
    state.ucCurrentSpeakerIdx += 1;
  } else {
    // Fin du tour de parole : on ouvre automatiquement les votes
    state.ucVotingOpen = true;
  }
  broadcastState();
}

function startNewUndercoverSpeakingTour() {
  state.ucTourNumber = (state.ucTourNumber || 1) + 1;
  state.ucCurrentSpeakerIdx = 0;
  state.ucVotingOpen = false;
  broadcastState();
}

function scoreFiestaAutomatically() {
  if (state.fiestaScored) return;
  const displayOrder = state.fiestaShuffledOrder || [1, 2, 3];
  [1, 2, 3].forEach(voterTeam => {
    const guesses = state.fiestaVotes[voterTeam];
    if (guesses) {
      // guesses[displayPos] contient le choix de l'équipe pour le Mot Final affiché en position displayPos (1, 2 ou 3)
      displayOrder.forEach((actualTeamChainId, idx) => {
        const displayPos = idx + 1;
        if (guesses[displayPos] === state.fiestaChains[actualTeamChainId].target) {
          state.scores[voterTeam] += 10;
        }
      });
    }
  });
  state.fiestaScored = true;
  state.fiestaPhase = 'REVEAL';
  broadcastState();
}

  if (myRole === 'HOST') {

      renderHostLoginGate(root);
    } else {
      renderHost(root);
      if (state.currentGame === 'PICTIONARY') initCanvasForElement('host-canvas');
    }
  } else {
    renderPlayer(root);
    if (state.currentGame === 'PICTIONARY' && myRole === state.picDrawerSlot) {
      initCanvasForElement('player-canvas');
    }
  }

                  <span class="font-bold text-amber-400">#${i+1} Équipe ${sub.team}</span> (${sub.time}) :
                  ${isVisible
                    ? `<span class="text-white font-semibold ml-1">« ${sub.text} »</span>`
                    : `<span class="text-slate-400 italic ml-1">🔒 Réponse enregistrée (masquée)</span>`
                  }
                </div>
                <div class="flex gap-2">
                  ${!isVisible ? `<button onclick="state.verseRevealedTeams = state.verseRevealedTeams || {}; state.verseRevealedTeams[${sub.team}] = true; broadcastState();" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded text-xs font-bold text-amber-300">👁️ Afficher</button>` : ''}
                  <button onclick="addPoints(${sub.team}, 20)" class="bg-emerald-600 px-3 py-1.5 rounded text-xs font-bold">+20 pts</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  } else if (state.currentGame === 'PICTIONARY') {
    const idx = state.roundIndex % GAME_DATA.pictionary.length;
    content = `
      <div class="bg-slate-900/80 border border-amber-500/40 rounded-2xl p-6 space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-700 pb-3">
          <div>
            <span class="text-xs uppercase tracking-widest text-amber-400 font-bold">Manche 5 • Iconographe (${idx + 1} / ${GAME_DATA.pictionary.length})</span>

            <button onclick="sendClearCanvas()" class="bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold">Effacer</button>
            <button onclick="state.revealed = true; broadcastState();" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold">Révéler</button>
            <button onclick="startGame('PICTIONARY', state.roundIndex + 1)" class="bg-indigo-600 px-4 py-2 rounded-lg text-xs font-bold">Suivant ➔</button>
          </div>

          <div class="w-full md:w-72 space-y-3">
            ${state.buzzedBy ? `
              <div class="p-4 rounded-xl bg-amber-500/20 border-2 border-amber-400 space-y-2">
                <div class="text-xs uppercase font-bold text-amber-300">🔔 Buzz Équipe ${state.buzzedBy.team}</div>
                <div class="text-sm text-white">« ${state.buzzedBy.answer || 'Oral'} »</div>
                <div class="flex gap-2 pt-1">
                  <button onclick="addPoints(${state.buzzedBy.team}, 25); addPoints(${state.picDrawerSlot[0]}, 10); state.revealed=true; stopTimer(); broadcastState();" class="bg-emerald-600 px-3 py-1.5 rounded text-xs font-bold">✅ +25 pts</button>

  }

  root.innerHTML = navBar + content;
}

function renderPlayer(root) {

  if (state.currentGame === 'LOBBY') {
    body = `<div class="text-center py-10 space-y-3"><div class="text-4xl">☦️</div><div class="text-xl font-bold text-white">Terminal ${myRole} prêt</div><p class="text-sm text-slate-400">Connecté pour l'Équipe ${myTeam}. Si vous êtes l'animateur, cliquez sur « 🚪 Quitter Terminal » en haut à droite.</p></div>`;
  } else if (state.currentGame === 'SYNAXAIRE') {
    if (!isCaptain) {
      body = `<div class="text-center py-8 text-sm text-slate-300">Soufflez la réponse à votre capitaine (<strong>Téléphone ${myTeam}A</strong>) !</div>`;
    } else {
      const locked = state.buzzedBy !== null;
      body = `
        <div class="space-y-4">
          <div class="text-xs uppercase font-bold text-amber-400 text-center">Manche 1 • Le Synaxaire</div>
          <input id="buzz-input" type="text" placeholder="Optionnel : tapez la réponse..." class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white">
          <button ${locked ? 'disabled' : ''} onclick="playerBuzz()" class="w-full py-8 rounded-2xl font-extrabold text-2xl ${locked ? 'bg-slate-700 text-slate-400' : 'bg-rose-600 text-white'}">
            ${locked ? (state.buzzedBy.team === myTeam ? '🔔 VOUS AVEZ LA MAIN !' : `🔒 Verrouillé`) : '🔔 BUZZER !'}
          </button>

    }
  } else if (state.currentGame === 'FIESTA') {
    if (!isCaptain) {
      body = `<div class="text-center py-8 text-sm text-slate-300">Passez le <strong>Téléphone ${myTeam}A</strong> entre coéquipiers !</div>`;
    } else if (state.fiestaPhase === 'WRITING') {
      const chain = state.fiestaChains[myTeam];
      if (chain.step >= 4) {
        body = `<div class="text-center py-8 text-emerald-400 font-bold">✅ Chaîne transmise avec succès !</div>`;
      } else {
        const promptLabel = chain.step === 0 ? `Sujet de départ : <strong class="text-amber-300 block text-xl mt-1">${chain.target}</strong>` : `Mot précédent : <strong class="text-amber-300 block text-xl mt-1">« ${chain.currentWord} »</strong>`;
        body = `
          <div class="space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700"><div class="text-xs uppercase text-slate-400 font-bold">Serviteur ${chain.step + 1} / 4</div><div class="mt-2 text-sm text-slate-200">${promptLabel}</div></div>
            <input id="fiesta-word" type="text" placeholder="UN SEUL mot indice..." class="w-full bg-slate-800 border border-amber-500/50 rounded-xl px-4 py-3 text-white text-lg">
            <button onclick="submitFiestaWord(${myTeam})" class="w-full py-4 bg-amber-600 rounded-xl font-extrabold text-slate-950">Valider & Passer le mobile ➔</button>
          </div>
        `;
      }
    } else if (state.fiestaPhase === 'VOTING') {
      const pack = GAME_DATA.fiesta[state.roundIndex % GAME_DATA.fiesta.length];
      const allOptions = [...pack.targets, ...pack.decoys].sort();
      const myPrevVote = state.fiestaVotes[myTeam] || {};
      const displayOrder = state.fiestaShuffledOrder || [1, 2, 3];
      const letters = ['A', 'B', 'C'];
      body = `
        <div class="space-y-4">
          <div class="text-sm font-bold text-amber-400">Associez chaque Mot Mystère à son sujet initial :</div>
          ${displayOrder.map((actualTeamId, posIdx) => {
            const displayPos = posIdx + 1;
            const prevVal = myPrevVote[displayPos] || '';
            return `
              <div class="bg-slate-800 p-3 rounded-xl space-y-1">
                <label class="text-xs text-slate-300 block">Mot Mystère ${letters[posIdx]} : <strong>« ${state.fiestaChains[actualTeamId].currentWord} »</strong></label>
                <select id="fiesta-sel-${displayPos}" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white">
                  <option value="" disabled ${!prevVal ? 'selected' : ''}>-- Sélectionner --</option>
                  ${allOptions.map(o => `<option value="${o}" ${prevVal===o?'selected':''}>${o}</option>`).join('')}

              </div>
            `;
          }).join('')}
          <button onclick="submitFiestaVote(${myTeam})" class="w-full py-3 bg-emerald-600 rounded-xl font-bold text-white">${state.fiestaVotes[myTeam] ? '✅ Vote enregistré (Mettre à jour)' : 'Envoyer le vote'}</button>
        </div>
      `;
    } else {
      body = `<div class="text-center py-8 text-sm text-slate-300">Regardez les résultats sur le grand écran !</div>`;
    }
  } else if (state.currentGame === 'UNDERCOVER') {
    const myInfo = state.ucAssignments[myRole] || { word: '...' };
    const order = state.ucSpeakingOrder || ['1A', '2A', '3A', '1B', '2B', '3A'];
    const currentSpeaker = order[state.ucCurrentSpeakerIdx] || order[0];
    const isMyTurn = !state.ucVotingOpen && !state.ucRevealed && currentSpeaker === myRole;
    const myVotesArr = Array.isArray(state.ucVotes[myTeam]) ? state.ucVotes[myTeam] : [];
    const slots = ['1A', '1B', '2A', '2B', '3A', '3B'];

    body = `
      <div class="space-y-4">
        <div class="bg-slate-800 border-2 border-amber-500/50 rounded-2xl p-5 text-center space-y-2">
          <div class="text-xs uppercase text-slate-400 font-bold">Votre Mot Secret (Gardez-le caché)</div>
          <div class="text-2xl font-extrabold text-amber-300">${myInfo.word}</div>
        </div>

        ${!state.ucVotingOpen && !state.ucRevealed ? `
          <div class="p-4 rounded-xl border ${isMyTurn ? 'bg-amber-500/20 border-amber-400 text-amber-200' : 'bg-slate-800/80 border-slate-700 text-slate-300'} text-center text-sm font-bold">
            ${isMyTurn ? '🎙️ C\'EST À VOUS DE DONNER UN INDICE ORAL !' : `🎙️ Au tour du Joueur <strong>${currentSpeaker}</strong> de parler...`}
          </div>
        ` : ''}

        ${isCaptain ? (
          state.ucVotingOpen ? `
            <div class="bg-slate-800/70 p-4 rounded-xl space-y-2 border border-rose-500/50">
              <div class="text-xs uppercase font-bold text-rose-300">Vote ouvert — Sélectionnez les 2 Infiltrés (${myVotesArr.length}/2) :</div>
              <div class="grid grid-cols-3 gap-2">
                ${slots.map(s => `<button onclick="sendEvent('UC_VOTE', { team: ${myTeam}, targetSlot: '${s}' })" class="py-2.5 rounded-lg font-bold text-xs ${myVotesArr.includes(s) ? 'bg-rose-600 text-white border-2 border-white' : 'bg-slate-900 text-slate-300 border border-slate-600'}">Joueur ${s}</button>`).join('')}
              </div>
            </div>
          ` : `<div class="text-center text-xs text-slate-400 italic">Les votes s'ouvriront sur votre téléphone dès que les 6 joueurs auront parlé.</div>`
        ) : ''}
      </div>
    `;
  } else if (state.currentGame === 'VERSES') {
    if (!isCaptain) {
      body = `<div class="text-center py-8 text-sm text-slate-300">Aidez votre capitaine à taper les mots manquants !</div>`;
    } else {
      const alreadySent = state.verseSubmissions.find(s => s.team === myTeam);
      body = alreadySent ? `<div class="text-center py-8 text-emerald-400 font-bold">✅ Réponse envoyée (${alreadySent.time}) !</div>` : `
        <div class="space-y-4">
          <div class="text-xs uppercase font-bold text-amber-400">Mots manquants :</div>
          <input id="verse-input" type="text" placeholder="Ex: mot 1, mot 2..." class="w-full bg-slate-800 border border-amber-500/50 rounded-xl px-4 py-3 text-white text-lg">
          <button onclick="submitVerse(${myTeam})" class="w-full py-4 bg-emerald-600 rounded-xl font-extrabold text-white">Envoyer</button>
        </div>
      `;
    }
  } else if (state.currentGame === 'PICTIONARY') {
    if (myRole === state.picDrawerSlot) {
      body = `
        <div class="space-y-3">
          <div class="bg-amber-500/20 border border-amber-400 p-3 rounded-xl text-center">
            <div class="text-[11px] uppercase text-amber-300 font-bold">À vous de dessiner !</div>
            <div class="text-base font-extrabold text-white">${state.picPrompt}</div>
          </div>
          <div class="flex justify-between items-center bg-slate-800 p-2 rounded-lg">
            <div class="flex gap-2">
              <button onclick="currentDrawColor='#0f172a'" class="w-6 h-6 rounded-full bg-slate-950 border border-white"></button>
              <button onclick="currentDrawColor='#dc2626'" class="w-6 h-6 rounded-full bg-red-600 border border-white"></button>
              <button onclick="currentDrawColor='#d97706'" class="w-6 h-6 rounded-full bg-amber-600 border border-white"></button>
              <button onclick="currentDrawColor='#2563eb'" class="w-6 h-6 rounded-full bg-blue-600 border border-white"></button>
            </div>
            <button onclick="sendClearCanvas()" class="px-2.5 py-1 bg-rose-700 rounded text-xs font-bold text-white">Effacer</button>
          </div>
          <canvas id="player-canvas" width="340" height="240" class="bg-white rounded-xl mx-auto block border-2 border-amber-500"></canvas>
        </div>
      `;
    } else if (isCaptain) {
      const locked = state.buzzedBy !== null;
      body = `
        <div class="space-y-4">
          <div class="text-xs text-center text-slate-300">Terminal <strong>${state.picDrawerSlot}</strong> dessine !</div>

  if (state.currentGame === 'PICTIONARY' && myRole === state.picDrawerSlot) {

/* ============================================================================
9. GESTION DU DESSIN PAR PAQUETS (DRAW_BATCH) & NETTOYAGE DES ÉCOUTEURS
   ============================================================================ */
function playerBuzz() {
  const input = document.getElementById('buzz-input');
  sendEvent('BUZZ', { slot: myRole, team: parseInt(myRole[0], 10), answer: input ? input.value.trim() : '' });
}
function submitFiestaWord(team) {
  const el = document.getElementById('fiesta-word');
  if (el && el.value.trim()) sendEvent('FIESTA_WORD', { team, word: el.value.trim() });
}
function submitFiestaVote(team) {
  const v1 = document.getElementById('fiesta-sel-1').value;
  const v2 = document.getElementById('fiesta-sel-2').value;
  const v3 = document.getElementById('fiesta-sel-3').value;
  if (!v1 || !v2 || !v3) {
    alert("Veuillez sélectionner une proposition pour chacun des 3 mots mystères avant de valider.");
    return;
  }
  sendEvent('FIESTA_VOTE', { team, guesses: { 1: v1, 2: v2, 3: v3 } });
}
function submitVerse(team) {
  const el = document.getElementById('verse-input');
  if (el && el.value.trim()) sendEvent('VERSE_SUBMIT', { team, text: el.value.trim() });
}

let activeCanvasHandlers = null;

function initCanvasForElement(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';

  if (activeCanvasHandlers) {
    window.removeEventListener('mouseup', activeCanvasHandlers.stop);
    window.removeEventListener('touchend', activeCanvasHandlers.stop);
  }

  let drawing = false;
  let lastPos = { x: 0, y: 0 };
  let pendingSegments = [];
  let batchInterval = null;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: parseFloat(((clientX - rect.left) / rect.width).toFixed(4)),
      y: parseFloat(((clientY - rect.top) / rect.height).toFixed(4))
    };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    lastPos = getPos(e);
    pendingSegments = [];

    if (!batchInterval) {
      batchInterval = setInterval(() => {
        if (pendingSegments.length > 0) {
          const batchToSend = [...pendingSegments];
          pendingSegments = [];
          
          drawSegmentsArrayLocally(ctx, batchToSend, canvas.width, canvas.height);
          
          sendEvent('DRAW_BATCH', {
            roundId: state.picRoundId,
            segments: batchToSend
          });
        }
      }, 120);
    }
  }

  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);

    const dx = pos.x - lastPos.x;
    const dy = pos.y - lastPos.y;
    if (Math.abs(dx) < 0.003 && Math.abs(dy) < 0.003) return;

    const seg = {
      x0: lastPos.x,
      y0: lastPos.y,
      x1: pos.x,
      y1: pos.y,
      color: currentDrawColor,
      width: currentDrawWidth
    };

    pendingSegments.push(seg);
    lastPos = pos;
  }

  function stop() {
    if (!drawing) return;
    drawing = false;
    if (batchInterval) {
      clearInterval(batchInterval);
      batchInterval = null;
    }
    if (pendingSegments.length > 0) {
      const batchToSend = [...pendingSegments];
      pendingSegments = [];
      drawSegmentsArrayLocally(ctx, batchToSend, canvas.width, canvas.height);
      sendEvent('DRAW_BATCH', {
        roundId: state.picRoundId,
        segments: batchToSend
      });
    }
  }

  canvas.onmousedown = start;
  canvas.onmousemove = move;
  canvas.ontouchstart = start;
  canvas.ontouchmove = move;

  activeCanvasHandlers = { stop };
  window.addEventListener('mouseup', stop);
  window.addEventListener('touchend', stop);
}

function drawSegmentsArrayLocally(ctx, segments, width, height) {
  segments.forEach(seg => {
    ctx.lineWidth = seg.width || 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = seg.color || '#0f172a';
    ctx.beginPath();
    ctx.moveTo(seg.x0 * width, seg.y0 * height);
    ctx.lineTo(seg.x1 * width, seg.y1 * height);
    ctx.stroke();
  });
}

function drawBatchOnCanvas(segments) {
  const hostCanvas = document.getElementById('host-canvas');
  if (hostCanvas) {
    drawSegmentsArrayLocally(hostCanvas.getContext('2d'), segments, hostCanvas.width, hostCanvas.height);
  }
  const playerCanvas = document.getElementById('player-canvas');
  if (playerCanvas && myRole !== state.picDrawerSlot) {
    drawSegmentsArrayLocally(playerCanvas.getContext('2d'), segments, playerCanvas.width, playerCanvas.height);
  }
}

function sendClearCanvas() {
  clearCanvasUI();
  sendEvent('CLEAR_CANVAS', { roundId: state.picRoundId });
}

function clearCanvasUI() {
  const hc = document.getElementById('host-canvas');
  if (hc) hc.getContext('2d').clearRect(0, 0, hc.width, hc.height);
  const pc = document.getElementById('player-canvas');
  if (pc) pc.getContext('2d').clearRect(0, 0, pc.width, pc.height);
}

// Lancement automatique
initMqtt();
render();
