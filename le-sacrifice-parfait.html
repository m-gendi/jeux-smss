<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KT 6e · Le sacrifice parfait</title>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--pl:#6E2E47;--gd:#C9A66B;--bg:#FFFFFF;--cd:#EBE3D0;--cr:#EBE3D0;--ink:#2E1A1F;--sub:#8A4A55;--rs:#A5636A;--hd:#6E2E47;--okb:#DDEFE0;--bdb:#F6DCDC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241720;--cd:#3A2633;--cr:#241720;--ink:#F4EAE0;--sub:#DDB0B6;--hd:#C9A66B;--okb:#1F3A2A;--bdb:#4A2226}}
:root[data-theme="dark"]{--bg:#241720;--cd:#3A2633;--cr:#241720;--ink:#F4EAE0;--sub:#DDB0B6;--hd:#C9A66B;--okb:#1F3A2A;--bdb:#4A2226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--cr);color:var(--ink);font:400 clamp(16px,1.7vw,22px)/1.4 Carlito,Calibri,system-ui,sans-serif}
main{flex:1;min-height:0;overflow:auto;display:flex}
.sl{flex:1;display:flex;animation:in .35s}@keyframes in{from{opacity:0}to{opacity:1}}
h1,h2,.serif{font-family:Caladea,Cambria,Georgia,serif;font-weight:700;margin:0;line-height:1.12}
.sp{flex:1;display:grid;grid-template-columns:minmax(230px,32%) 1fr}
.sd{background:var(--pl);color:#fff;padding:clamp(20px,3.5vw,48px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.sd small{color:var(--gd);font-size:.9rem;letter-spacing:.06em}.sd h2{font-size:clamp(1.7rem,3.4vw,2.7rem)}
.kw{margin:0;color:var(--gd);font:italic 700 clamp(1.1rem,2vw,1.5rem) Caladea,serif}.sd svg{width:min(150px,60%);margin-top:6px}
.mn{background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:clamp(16px,3vw,44px)}
.jl{display:block;margin-top:5px;color:var(--pl);font-weight:700}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .jl{color:var(--gd)}}
:root[data-theme="dark"] .jl{color:var(--gd)}
.it{display:flex;gap:16px;align-items:center;background:var(--cd);border-radius:14px;padding:14px 18px}
.it i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--rs);color:#fff;font:700 1.2rem Caladea,serif;display:grid;place-items:center}
.it b{display:block;font-size:1.15em}.it span{color:var(--sub)}
.vr{display:block;font-style:italic;color:var(--ink);margin-top:3px}.hd{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}.hd.on{opacity:1;transform:none}.qz .an .vr{font-weight:400}.tl{opacity:0;transition:opacity .4s}.tl.on{opacity:1}.tb{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}.tb .col{display:flex;flex-direction:column;gap:8px}.tb .qz{padding:8px 12px}.hint{margin:0;color:var(--sub);font-style:italic}
.ref{margin:4px 0 0;font-size:.85rem;color:var(--sub)}
.fb{flex:1;background:var(--pl);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(20px,4vw,56px);gap:16px}
.fb h1{font-size:clamp(2.4rem,7vw,5rem)}.fb .cx{width:clamp(90px,15vw,150px);color:var(--gd)}
.fb em{font:italic 400 clamp(1.2rem,2.6vw,1.9rem) Caladea,serif;color:#F1E4D0;max-width:26ch}.fb .gd{color:var(--gd);font-size:clamp(1rem,2vw,1.4rem)}
.cr{flex:1;padding:clamp(20px,3.5vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.cr h2{color:var(--pl);font-size:clamp(1.7rem,4vw,3rem)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cr h2{color:var(--gd)}}
:root[data-theme="dark"] .cr h2{color:var(--gd)}
.g3,.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.ax{background:var(--bg);border-radius:16px;padding:22px 16px;text-align:center}.ax i{width:64px;height:64px;font-size:1.8rem;margin:0 auto 10px;border-radius:50%;background:var(--pl);color:#fff;display:grid;place-items:center;font-style:normal;font-family:Caladea,serif;font-weight:700}
.ax b{display:block;font-size:1.2em}.ax span{color:var(--sub);font-style:italic}
.mc{background:var(--cd);border-radius:12px;padding:10px 14px}.mc b{display:block;color:var(--pl)}.mc span{font-size:.92em;color:var(--sub)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mc b{color:var(--gd)}}
:root[data-theme="dark"] .mc b{color:var(--gd)}
.hz{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.hz em{color:var(--rs);font-size:1.6rem;font-style:normal}
.pill{display:inline-block;background:var(--pl);color:#fff;border-radius:99px;padding:8px 20px;font:700 1.05em Caladea,serif}.pill.go{background:var(--gd);color:#2E1A1F}
.q{font:700 clamp(1.15rem,2.4vw,1.7rem) Caladea,serif;color:var(--pl);margin:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .q{color:var(--gd)}}
:root[data-theme="dark"] .q{color:var(--gd)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px}.vs>div{border-radius:16px;padding:20px 24px;background:var(--bg)}.vs .j{background:var(--pl);color:#fff}
.vs h3{font:700 1.3rem Caladea,serif;margin:0 0 8px}.vs .j h3{color:var(--gd)}.vs p{margin:4px 0}
.qz{cursor:pointer;background:var(--bg);border-radius:14px;padding:14px 18px;border:2px solid transparent}.qz b{display:block}.qz .an{display:none;margin-top:6px;color:var(--pl);font-weight:700}.qz.op{border-color:var(--gd)}.qz.op .an{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .qz .an{color:var(--gd)}}
:root[data-theme="dark"] .qz .an{color:var(--gd)}
.rv{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}.rv.on{opacity:1;transform:none}
#nt{max-height:40vh;overflow:auto;display:none;background:#2E1A1F;color:#F4EAE0;padding:10px 18px;font-size:1rem}#nt.on{display:block}#nt b{color:var(--gd)}
footer{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--pl)}#pb{height:4px;background:var(--gd);width:0;transition:width .3s}
.b{background:transparent;color:#fff;border:1.5px solid var(--gd);border-radius:10px;padding:5px 16px;font:700 1rem Carlito,sans-serif;cursor:pointer}.b:disabled{opacity:.35;cursor:default}.b[aria-pressed="true"]{background:var(--gd);color:#2E1A1F}
.b:focus-visible,.qz:focus-visible{outline:3px solid var(--gd);outline-offset:2px}#ct{color:var(--gd);margin-left:auto;font-weight:700}
.mt,.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.mt .col{display:flex;flex-direction:column;gap:10px}
.gb{font:inherit;text-align:left;background:var(--cd);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 14px;cursor:pointer}.mt .gb:not(.alt){font-weight:700}
.gb.sel{border-color:var(--gd);box-shadow:0 0 0 3px rgba(201,166,107,.5)}.gb.ok{background:var(--okb);cursor:default}.gb:disabled{opacity:.3;cursor:default}
.fbk{margin:0;padding:10px 14px;border-radius:12px;background:var(--cd);min-height:46px}.fbk.good{background:var(--okb)}.fbk.bad{background:var(--bdb)}
.bank{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:99px;font-weight:700}
.built{min-height:3.4rem;font:700 clamp(1.1rem,2.6vw,1.6rem) Caladea,serif;color:var(--hd);background:var(--cd);border:2px dashed var(--rs);border-radius:12px;padding:12px 16px}
.sc{border:2px dashed var(--rs);border-radius:12px;padding:10px;min-height:120px;cursor:pointer}.sc h3{font:700 1.15rem Caladea,serif;margin:0 0 6px;color:var(--hd)}.si{background:var(--cd);border-radius:8px;padding:5px 10px;margin:4px 0}
.ag{background:var(--pl);color:#fff;border:0;border-radius:10px;padding:8px 18px;font:700 1rem Carlito,sans-serif;cursor:pointer;align-self:flex-start}
.sk{animation:sk .35s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:760px){.sp,.vs,.mt,.sw,.tb{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rv{transition:none}.sl{animation:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="x" viewBox="0 0 100 100"><path d="M40 8h20v32h32v20H60v32H40V60H8V40h32z" fill="currentColor"/><g fill="currentColor"><circle cx="40" cy="6" r="5"/><circle cx="50" cy="4" r="5"/><circle cx="60" cy="6" r="5"/><circle cx="40" cy="94" r="5"/><circle cx="50" cy="96" r="5"/><circle cx="60" cy="94" r="5"/><circle cx="6" cy="40" r="5"/><circle cx="4" cy="50" r="5"/><circle cx="6" cy="60" r="5"/><circle cx="94" cy="40" r="5"/><circle cx="96" cy="50" r="5"/><circle cx="94" cy="60" r="5"/></g><circle cx="50" cy="50" r="9" fill="none" stroke="#6E2E47" stroke-width="3"/></symbol></svg>

<footer><button class="b" id="tn" aria-pressed="false">Notes</button><span id="ct"></span><button class="b" id="pv">◂</button><button class="b" id="nx">Suivant ▸</button></footer>
<script>
const SB=(k,h,w,x='')=>`<aside class="sd"><small>${k}</small><h2>${h}</h2>${w?`<p class="kw">${w}</p>`:''}${x}</aside>`;
const I=(n,t,s,r=1)=>`<div class="it ${r==2?'hd':r?'rv':''}"><i>${n}</i><div><b>${t}</b>${s?`<span>${s}</span>`:''}</div></div>`;
const J=(n,t,j,r=2)=>`<div class="it ${r==2?'hd':'rv'}"><i>${n}</i><div><b>${t}</b><span class="jl">→ Jésus : ${j}</span></div></div>`;
const L=(sd,body,ref)=>`<div class="sp">${sd}<div class="mn">${body}${ref?`<p class="ref">${ref}</p>`:''}</div></div>`;
const M=(t,s)=>`<div class="mc"><b>${t}</b><span>${s}</span></div>`;
const Q=(t,a)=>`<div class="qz" tabindex="0"><b>${t}</b><div class="an">${a}</div></div>`;
const X=`<svg class="cx"><use href="#x"/></svg>`;
const altar=`<svg viewBox="0 0 200 190"><rect x="30" y="120" width="140" height="62" rx="4" fill="#C9A66B" opacity=".55"/><rect x="22" y="110" width="156" height="14" fill="#C9A66B"/><g stroke="#EBE3D0" stroke-width="9" stroke-linecap="round"><path d="M56 104l88-16M56 88l88 16"/></g><path d="M100 88c-26-14-14-36-4-58 6 16 28 24 26 44-1 9-9 14-22 14z" fill="#E58A3A"/><path d="M100 88c-12-8-6-20 0-30 6 8 14 12 12 22-1 5-5 8-12 8z" fill="#F5C34A"/></svg>`;
// [nom, html, à dire, classe]
const S=[
['Page de garde',`<div class="fb">${X}<h1>Le sacrifice parfait</h1><p class="gd">Ancien Testament · Lévitique 1 à 6</p><em>Comment Dieu a-t-Il préparé Son peuple à comprendre Son sacrifice, en Jésus-Christ ?</em></div>`,'Poser la question et laisser les élèves répondre : c’est le fil du cours. Bien insister : Jésus, c’est Dieu venu parmi nous, pas quelqu’un d’autre que Dieu aurait envoyé.'],
['Le plan du cours',`<div class="cr"><h2>Aujourd’hui</h2><p class="q">Dans le chapitre 1, nous avons vu pourquoi l’homme avait besoin d’être sauvé.</p><div class="g3"><div class="ax"><i>1</i><b>Pourquoi des sacrifices ?</b><span>le but</span></div><div class="ax"><i>2</i><b>Les cinq sacrifices</b><span>ce qu’ils disent de Jésus</span></div><div class="ax"><i>3</i><b>Pourquoi Jésus ?</b><span>le sacrifice parfait</span></div></div></div>`,'Rappel très court du chapitre 1, puis annoncer les trois parties du cours.'],
['D’où viennent les sacrifices ?',L(SB('AVANT DE COMMENCER','D’où viennent les sacrifices ?'),I(1,'Un plan de Dieu depuis toujours','La Croix n’est pas une idée apparue le jour de la Crucifixion : elle était dans la pensée de Dieu depuis l’éternité.')+I(2,'Dieu prépare son peuple','Dans l’Ancien Testament, il donne des signes et des symboles pour faire comprendre la Rédemption.')+I(3,'Les sacrifices','Ils sont l’un de ces symboles, depuis Caïn et Abel.')+I(4,'Le livre du Lévitique','Dieu y explique aux prêtres comment offrir les sacrifices.')),'Dieu avait un plan et il a préparé son peuple pas à pas. Les sacrifices en font partie, et le Lévitique explique comment les offrir.'],
['Pourquoi des sacrifices ?',L(SB('AXE 1','Pourquoi des sacrifices ?','Péché → mort → sacrifice → pardon'),I(1,'PÉCHÉ','L’homme est en tort : son péché attriste le cœur de Dieu et détruit sa vie.',2)+I(2,'MORT','À cause de son péché, l’homme mérite la mort.',2)+I(3,'SACRIFICE','Un animal innocent meurt à la place de l’homme coupable.',2)+I(4,'EXPIATION · PURIFICATION · PARDON','Le but des sacrifices : l’expiation du péché, la purification de toute impureté, l’obtention du pardon.',2)),'Un point à la fois. Péché, mort, sacrifice, pardon : le fil du cours. Les versets (Romains 6:23, Hébreux 9:22) arrivent en détail deux slides plus loin, avec les 5 étapes : pas besoin de les redire ici.'],
['Pourquoi un animal innocent ?',L(SB('AXE 1','Pourquoi un animal innocent ?'),`<div class="it"><i>?</i><div><b>L’animal avait-il péché ?</b><span><strong>Non.</strong> Il est innocent.</span></div></div>`+I(1,'Il prend la place du coupable','La personne pose la main sur sa tête et confesse ses péchés : ils passent sur l’animal.',2)+I(2,'Il rachète','Une âme innocente rachète une âme qui mérite la mort.',2)+I(3,'Il annonce Jésus','Il est le symbole du Christ, « qui a porté lui-même nos péchés en son corps sur le bois ».',2),'1 Pierre 2:24'),'Poser la question et laisser répondre : non, il est innocent. Puis un point à la fois. C’est le cœur du cours : l’innocent prend la place du coupable, et cela annonce Jésus.'],
['Où offrait-on les sacrifices ?',L(SB('LE LIEU','Où offrait-on les sacrifices ?','Retrouve chaque endroit du plan'),`<div class="tb"><svg viewBox="0 0 460 260" style="width:100%;color:var(--ink);font:700 11px Carlito,sans-serif" role="img" aria-label="Plan simplifié du tabernacle, avec des numéros"><rect x="8" y="8" width="312" height="244" rx="14" fill="none" stroke="#A5636A" stroke-width="2.5" stroke-dasharray="7 6"/><text x="22" y="30" fill="currentColor" opacity=".7">LE PARVIS</text><text x="22" y="44" fill="currentColor" opacity=".6" font-style="italic" font-size="9.5">(à l’air libre)</text><rect x="30" y="70" width="190" height="120" rx="6" fill="#EBE3D0" stroke="#6E2E47" stroke-width="3"/><rect x="30" y="70" width="70" height="120" fill="#C9A66B" opacity=".6"/><line x1="100" y1="70" x2="100" y2="190" stroke="#8B1E24" stroke-width="6"/><rect x="114" y="120" width="20" height="22" fill="#6E2E47"/><rect x="217" y="112" width="8" height="36" fill="#C9A66B"/><path d="M271 118c-11-8-6-20-1-30 4 8 15 13 13 24-1 5-5 6-12 6z" fill="#E58A3A"/><rect x="248" y="118" width="46" height="42" fill="#8A7358" stroke="#2E1A1F" stroke-width="2"/><path class="tl" data-k="7" d="M392 214c-16-11-9-29-1-44 6 11 22 19 19 35-2 8-8 9-18 9z" fill="#E58A3A"/><use class="tl" data-k="7" href="#x" x="372" y="46" width="40" height="40" style="color:#C9A66B"/><g fill="#2E1A1F"><text class="tl" data-k="1" x="160" y="92" text-anchor="middle">Tente de la Rencontre</text><text class="tl" data-k="2" x="65" y="128" text-anchor="middle">Saint</text><text class="tl" data-k="2" x="65" y="141" text-anchor="middle">des Saints</text><text class="tl" data-k="4" x="124" y="160" text-anchor="middle">Autel de</text><text class="tl" data-k="4" x="124" y="172" text-anchor="middle">l’encens</text></g><g fill="currentColor"><text class="tl" data-k="3" x="100" y="205" text-anchor="middle">le voile</text><text class="tl" data-k="5" x="221" y="164" text-anchor="middle">entrée</text><text class="tl" data-k="6" x="271" y="176" text-anchor="middle">Autel des</text><text class="tl" data-k="6" x="271" y="188" text-anchor="middle">holocaustes</text><text class="tl" data-k="7" x="392" y="30" text-anchor="middle">HORS DU CAMP</text><text class="tl" data-k="7" x="392" y="102" text-anchor="middle">Jésus crucifié</text><text class="tl" data-k="7" x="392" y="114" text-anchor="middle">hors de Jérusalem</text><text class="tl" data-k="7" x="392" y="228" text-anchor="middle">Expiation brûlée</text><text class="tl" data-k="7" x="392" y="240" text-anchor="middle">hors du camp</text></g><g fill="#6E2E47"><circle cx="36" cy="62" r="10"/><circle cx="65" cy="102" r="10"/><circle cx="100" cy="64" r="10"/><circle cx="124" cy="108" r="10"/><circle cx="221" cy="100" r="10"/><circle cx="252" cy="112" r="10"/><circle cx="352" cy="200" r="10"/></g><g fill="#fff" text-anchor="middle"><text x="36" y="66">1</text><text x="65" y="106">2</text><text x="100" y="68">3</text><text x="124" y="112">4</text><text x="221" y="104">5</text><text x="252" y="116">6</text><text x="352" y="204">7</text></g></svg><div class="col"><div class="qz" tabindex="0" data-k="1"><b>1. Quel est cet endroit ?</b><div class="an">La Tente de la Rencontre (le tabernacle) : le sanctuaire. On n’y entre pas sans le sang.</div></div><div class="qz" tabindex="0" data-k="2"><b>2. Quel est cet endroit ?</b><div class="an">Le Saint des Saints. Seul le grand prêtre pouvait y entrer, une fois par an.</div></div><div class="qz" tabindex="0" data-k="3"><b>3. Quel est cet endroit ?</b><div class="an">Le voile : le grand rideau qui sépare le Saint des Saints du reste de la Tente. On en reparle à la slide « Expiation ».</div></div><div class="qz" tabindex="0" data-k="4"><b>4. Quel est cet endroit ?</b><div class="an">L’autel de l’encens. Pour l’expiation, le prêtre y asperge du sang, avec le voile.</div></div><div class="qz" tabindex="0" data-k="5"><b>5. Quel est cet endroit ?</b><div class="an">L’entrée de la Tente : on y présente l’animal.</div></div><div class="qz" tabindex="0" data-k="6"><b>6. Quel est cet endroit ?</b><div class="an">L’autel des holocaustes : à l’air libre, devant l’entrée. Le sacrifice y est brûlé et le sang est aspergé autour.</div></div><div class="qz" tabindex="0" data-k="7"><b>7. Quel est cet endroit ?</b><div class="an">Hors du camp : le sacrifice d’expiation y est brûlé. Jésus a été crucifié hors de Jérusalem.</div></div></div></div><p class="hint">Clique sur un numéro pour voir la réponse : le nom apparaît sur le plan.</p>`,'Plan simplifié d’après la description du tabernacle dans l’Ancien Testament (le cours ne donne pas de plan)'),'Montrer le plan avec les numéros seulement. Demander aux élèves de retrouver chaque endroit (Saint des Saints, voile, entrée…). Le Parvis, c’est la cour à ciel ouvert autour de la Tente : c’est là, en plein air, que se trouve l’autel des holocaustes — pas dans un bâtiment fermé. Cliquer sur la carte du numéro pour montrer la réponse : le nom apparaît sur le plan.'],
['Comment se passait un sacrifice ?',L(SB('LE DÉROULEMENT','Comment se passait un sacrifice ?'),I(1,'On présente l’animal','à l’entrée de la Tente de la Rencontre',2)+I(2,'On pose la main sur sa tête','on confesse son péché : les péchés sont transférés sur l’animal<em class="vr">« …sans effusion de sang il n’y a pas de pardon » (Hébreux 9:22, LSG)</em>',2)+I(3,'L’animal est sacrifié','devant le Seigneur : il meurt à la place de l’homme, qui mérite la mort<em class="vr">« Car le salaire du péché, c’est la mort » (Romains 6:23, LSG)</em>',2)+I(4,'Le sang est aspergé','autour de l’autel : le culte repose sur le sang',2)+I(5,'Tout ou partie est brûlé','sur l’autel, avec le bois et le feu',2)+`<p class="hint hd">On ne mange ni le sang ni la graisse : ils appartiennent au Seigneur.<em class="vr">« …vous ne mangerez point de chair avec son âme, avec son sang » (Genèse 9:4, LSG)</em></p>`,'Lévitique 1 à 6'),'Cinq étapes, une à la fois. Le verset de l’étape 2 (Hébreux 9:22) explique pourquoi il faut du sang. Celui de l’étape 3 (Romains 6:23) explique pourquoi l’animal meurt. Le verset sur l’animal qui porte le péché (1 Pierre 2:24) a déjà été vu à la slide précédente : pas la peine de le redire.'],
['L’holocauste',L(SB('LÉVITIQUE 1','Holocauste','Le don total<br>L’obéissance du Fils',altar),`<p class="hint">C’est le premier sacrifice, offert pour être accepté devant Dieu et pour le pardon des péchés.</p>`+J(1,'On choisit un mâle, sans défaut, parmi les animaux.','il est sans péché — parfaitement pur, digne d’être offert pour nous.')+J(2,'L’animal est entièrement brûlé sur l’autel ; seule la peau est enlevée avant.','il se donne totalement, sans rien garder pour lui : le don total et l’obéissance parfaite du Christ.')+J(3,'Les morceaux sont posés sur le bois, puis brûlés par le feu.','le bois de l’autel rappelle le bois de la Croix ; le feu est le feu divin qui consume le péché.')+`<p class="q hd">« Et, ayant paru comme un simple homme, il s’est humilié lui-même, se rendant obéissant jusqu’à la mort, même jusqu’à la mort de la croix. »<span class="hint" style="display:block;font:italic 400 .75em Carlito,sans-serif;margin-top:4px">Philippiens 2:8, LSG</span></p>`,'Lévitique 1:9 : une odeur agréable pour le Seigneur'),'Montrer l’autel à gauche. À droite, un point à la fois : le fait dans le Lévitique, puis ce que ça dit de Jésus. Lire le verset complet à la fin.'],
['L’offrande',L(SB('LÉVITIQUE 2','Offrande','L’offrande végétale, sans sang<br>L’Incarnation du Fils'),`<p class="hint">Contrairement aux autres, elle ne contient aucun animal : c’est une offrande végétale, faite de farine. Clique sur chaque mot pour voir son sens.</p><div class="g2">${Q('FARINE','Jésus s’est comparé lui-même à un grain de blé : « si le grain de blé tombé en terre ne meurt pas, il reste seul ; mais s’il meurt, il porte beaucoup de fruit » (Jean 12:24).')}${Q('HUILE','C’est de l’huile d’olive pure, symbole du Saint-Esprit : « L’Éternel m’a oint pour apporter de bonnes nouvelles aux pauvres » (Ésaïe 61:1).')}${Q('ENCENS','Il symbolise la prière et le sacerdoce du Christ : « …dont l’odeur est agréable à l’Éternel » (Lévitique 1:17).')}${Q('SEL','Il donne saveur et préserve de la corruption : « Vous êtes le sel de la terre » (Matthieu 5:13).')}${Q('FEU','La farine est cuite au feu, comme les souffrances que Jésus a supportées toute sa vie, pas seulement sur la Croix.')}${Q('POT D’ARGILE','Une forme de cette offrande est cuite dans un pot d’argile, qui représente la Vierge Marie : elle a porté le Seigneur Jésus.')}${Q('❌ SANS LEVAIN','Le levain n’est pas ajouté : il représente le péché. Le blanc de l’offrande montre la pureté du Christ.')}${Q('❌ SANS MIEL','Le miel n’est pas ajouté non plus : il représente les plaisirs et les convoitises.')}</div><p class="q">Jésus est venu vivre parmi nous pour accomplir l’œuvre du salut.</p>`,'Lévitique 2'),'Cliquer sur chaque carré (tous visibles d’un coup) pour voir son sens, avec le verset du cours. Bien dire d’abord : contrairement aux quatre autres, l’offrande n’a pas de sang, c’est une offrande végétale. Les deux cartes ❌ sont ce qu’on n’ajoute jamais.'],
['L’action de grâces / la paix',L(SB('LÉVITIQUE 3','Action de grâces et paix','La communion'),`<p class="hint">C’est un sacrifice offert pour remercier Dieu, et c’est le seul dont on mange.</p>`+J(1,'On pose la main sur l’animal et on remercie Dieu ; sa graisse est brûlée pour Lui, et le reste est mangé par le prêtre, celui qui offre, et ses amis.','manger ensemble est un signe de communion avec Dieu et avec les hommes.',1)+J(2,'Ce sacrifice vient après l’holocauste et l’offrande.','la paix ne peut venir qu’après la réconciliation accomplie par Jésus sur la Croix.',1),'Lévitique 3'),'Le lien avec l’Eucharistie (« action de grâces » en grec) est vu plus loin, sur la slide « Aujourd’hui, à l’église » : pas besoin de le redire ici.'],
['L’expiation',L(SB('LÉVITIQUE 4','Expiation','Le sacrifice pour le péché<br>Jésus porte nos péchés'),`<p class="hint">C’est le sacrifice offert pour le péché.</p>`+J(1,'Pour des péchés commis par erreur ou involontairement, un faux serment, un faux témoignage.','le sacrifice de Jésus est une expiation parfaite : il porte nos péchés, une fois pour toutes.')+J(2,'Le prêtre prend le sang, entre dans la Tente, et en asperge sept fois le voile et l’autel de l’encens.','le voile symbolise le Corps du Christ ; il fut déchiré le jour de la crucifixion.')+J(3,'Ces sept aspersions sont le signe d’un pardon total des péchés.','par Jésus, notre pardon est total et parfait : « …a porté lui-même nos péchés en son corps sur le bois » (1 Pierre 2:24, LSG).'),'Lévitique 4'),'Un point à la fois : ce que dit le Lévitique, puis ce que ça dit de Jésus juste en dessous. Conclure par : le sacrifice de Jésus est une expiation parfaite.'],
['La culpabilité',L(SB('LÉVITIQUE 5–6','Culpabilité','Une faute qui a fait du tort<br>Jésus porte notre faute'),`<p class="hint">Ici « culpabilité » ne veut pas dire « se sentir coupable » : c’est une faute qui a fait du tort, à Dieu ou aux autres.</p>`+J(1,'Une faute envers Dieu (dîmes, vœux, prémices…) ou envers les autres (vol, faux témoignage, trahir un ami).','le bélier offert pour ce sacrifice symbolise Jésus, qui « s’est fait lui-même sacrifice de culpabilité » (Ésaïe 53:10).',1)+J(2,'On répare : le montant dû, une amende pour le retard, ou jusqu’à cinq fois le dommage causé.','il ne suffit pas de demander pardon, il faut aussi réparer — « Celui qui n’a point connu le péché, il l’a fait devenir péché pour nous, afin que nous devenions en lui justice de Dieu » (2 Corinthiens 5:21, LSG).',1),'Lévitique 5–6'),'Message clé : il ne suffit pas de regretter, il faut aussi réparer. Le verset (2 Corinthiens 5:21) n’est pas dans ce cours : il est utilisé ici parce que le cours ne donne pas de verset pour ce point précis, et que ce verset est reconnu dans toutes les traditions chrétiennes.'],
['Pourquoi Jésus devait-Il venir ?',L(SB('AXE 3','Si les sacrifices existaient déjà, pourquoi Jésus devait-Il venir ?'),I(1,'Ils préparaient','Ils étaient des signes et des symboles de la Rédemption.',2)+I(2,'Ils étaient répétés','Chaque jour, le sang était versé.',2)+I(3,'Ils ne suffisaient pas','« …il est impossible que le sang des taureaux et des boucs ôte les péchés » (Hébreux 10:4)',2)+I(4,'Le Christ, une fois pour toutes','« …avec son propre sang, ayant obtenu une rédemption éternelle » (Hébreux 9:12)',2)),'Poser la question aux élèves d’abord, un point à la fois. Il fallait un sacrifice offert une seule fois : celui du Christ. Sa mort a mis fin aux sacrifices d’animaux.'],
['Aujourd’hui, à l’église',L(SB('','Aujourd’hui, à l’église'),`<p class="hint">Clique sur un mot pour voir son explication — et le sacrifice qu’il nous rappelle.</p><div class="g2">${Q('L’Agneau','le prêtre le choisit, puis fait le tour de l’autel avec lui. <i>(Holocauste)</i>')}${Q('Le Sang','le prêtre fait tourner son doigt autour du bord de la coupe, pour montrer que le Sang du Christ est pour tous et pour tous les temps. <i>(Holocauste)</i>')}${Q('La Réconciliation','la prière qui symbolise la réconciliation entre Dieu et l’humanité. <i>(Action de grâces)</i>')}${Q('L’Eucharistie','le sacrement d’action de grâce pour le sacrifice du Christ. <i>(Action de grâces)</i>')}${Q('La Fraction','le prêtre divise le Corps en plusieurs parties, puis y dépose du Sang. <i>(Expiation)</i>')}${Q('La Paskha','l’Église en récite les prières hors du sanctuaire pendant la Semaine Sainte, en référence à la crucifixion hors du camp (Jérusalem). <i>(Expiation)</i>')}${Q('La communion','on s’unit à son Corps et à son Sang, qui guérissent nos fautes passées et à venir. <i>(Culpabilité)</i>')}</div>`,'D’après le cours uniquement (les tableaux « Symboles dans la Divine Liturgie », un par sacrifice)'),'Tout ce qui est écrit ici vient directement du cours ; j’ai retiré ce que j’avais ajouté moi-même (le pain pour l’Agneau, le moment précis de la Réconciliation dans la messe), qui ne venait pas du cours. Clique mot par mot.'],
['Jeu 1 · Relie les sacrifices à Jésus',L(SB('JEU 1','Relie chaque sacrifice à Jésus','Un sacrifice → ce qu’il nous fait comprendre du Christ'),`<div data-g="match"></div>`),'Les élèves choisissent un sacrifice, puis sa bonne réponse. C’est un jeu de révision : ils reconnaissent les cinq aspects du Christ.'],
['Jeu 2 · Ancien Testament ou Jésus ?',L(SB('JEU 2','Ancien Testament ou Jésus ?','Range chaque mot dans la bonne colonne'),`<div data-g="sort"></div>`),'Ils rangent chaque mot. À la fin, ils comprennent pourquoi Jésus est le sacrifice parfait.'],
['Jeu 3 · Le verset à retenir',L(SB('JEU 3','Le verset à retenir','Touche les mots dans le bon ordre'),`<p class="hint">Hébreux 9:12 : il résume tout le chapitre.</p><div data-g="verse"></div>`),'Laisse-les remettre les mots dans l’ordre. Une fois fini, relis le verset tous ensemble.'],
['Quiz',`<div class="cr"><h2>Quiz</h2><p class="hint">Clique sur une question pour voir la réponse.</p><div class="g2">${Q('1. Dans quel livre trouve-t-on ces sacrifices ?','Le Lévitique')}${Q('2. Pourquoi offrait-on un sacrifice ?','Pour l’expiation, la purification et le pardon : l’animal innocent prenait la place de l’homme coupable')}${Q('3. Que nous font comprendre les cinq sacrifices ?','Obéissance · incarnation · paix · Jésus porte nos péchés · faute et réparation')}${Q('4. Pourquoi les sacrifices étaient-ils répétés ?','Le sang des animaux ne pouvait pas enlever les péchés')}${Q('5. Pourquoi Jésus est-Il le sacrifice parfait ?','Il s’est offert Lui-même, sans péché, une fois pour toutes, avec Son propre sang')}</div></div>`,'Cliquer sur une carte pour voir la réponse. La question 2 est le cœur du cours.'],
['À retenir',`<div class="cr"><h2>À retenir</h2><div class="hz" style="flex-direction:column;align-items:center;text-align:center">${['ANCIEN TESTAMENT','SACRIFICES','PRÉPARATION','JÉSUS-CHRIST','SACRIFICE PARFAIT'].map((t,k)=>`<div class="rv">${k?'<em style="color:var(--rs)">↓</em><br>':''}<span class="pill${k==4?' go':''}">${t}</span></div>`).join('')}</div></div>`,'Lire la chaîne de haut en bas : c’est le résumé de tout le cours en une phrase.'],
['Fin',`<div class="fb">${X}<em class="rv" style="max-width:30ch">Les sacrifices de l’Ancien Testament préparaient le peuple à comprendre le sacrifice parfait de Jésus-Christ.</em><p class="gd rv">Il s’est offert Lui-même une fois pour toutes.</p></div>`,'Lire la phrase finale, puis la deuxième.'],
];
const sh=a=>[...a].sort(()=>Math.random()-.5);
const E=(t,c,h)=>{const e=document.createElement(t);e.className=c||'';e.innerHTML=h||'';return e};
const shk=b=>{b.classList.add('sk');setTimeout(()=>b.classList.remove('sk'),400)};
const GM={
match(h){
 const D=[['Holocauste','Il se donne entièrement et obéit parfaitement','C’est le don total et l’obéissance parfaite du Christ.'],['Offrande','Il s’est incarné et a vécu parmi nous','L’offrande rappelle l’Incarnation et la vie du Christ sur la terre.'],['Action de grâces et paix','Il nous donne la paix et la communion','Ce sacrifice est lié à l’action de grâce, à la paix et à la communion.'],['Expiation','Il porte nos péchés','Jésus porte nos péchés : il a accompli une expiation parfaite.'],['Culpabilité','Il porte notre faute','Ce sacrifice concerne la faute : il faut aussi réparer le tort causé.']];
 const fb=E('p','fbk','Choisis un sacrifice à gauche, puis ce qu’il nous fait comprendre de Jésus à droite.'),g=E('div','mt'),ca=E('div','col'),cb=E('div','col');let sel=null,n=0;
 const ls=D.map((d,i)=>{const b=E('button','gb',d[0]);b.onclick=()=>{if(b.classList.contains('ok'))return;ls.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=i;fb.className='fbk';fb.textContent='Maintenant, trouve la bonne réponse à droite.'};ca.append(b);return b});
 sh(D.map((d,i)=>i)).forEach(i=>{const b=E('button','gb alt',D[i][1]);b.onclick=()=>{if(b.classList.contains('ok'))return;if(sel===null){fb.textContent='Commence par choisir un sacrifice à gauche.';return}
  if(sel===i){b.classList.add('ok');ls[i].classList.remove('sel');ls[i].classList.add('ok');fb.className='fbk good';fb.innerHTML='<b>Bravo !</b> '+D[i][2];sel=null;if(++n==D.length)fb.innerHTML+='<br><b>Cinq sacrifices, mais une seule œuvre parfaite du Christ.</b>'}
  else{shk(b);fb.className='fbk bad';fb.textContent='Pas tout à fait… essaie encore !'}};cb.append(b)});
 g.append(ca,cb);h.append(g,fb)},
sort(h){
 const it=[['Des animaux',0,'Dans l’Ancien Testament, on offrait des animaux.'],['Lui-même',1,'Jésus s’est offert Lui-même.'],['Sacrifices répétés',0,'Ils étaient répétés : le sang était versé chaque jour.'],['Une fois pour toutes',1,'Le Christ accomplit la Rédemption une fois pour toutes.'],['Des symboles',0,'Les sacrifices étaient des signes et des symboles, une préparation.'],['Sans péché',1,'Jésus est sans péché.'],['Le sang des taureaux et des boucs',0,'Il ne peut pas ôter les péchés.'],['Son propre sang',1,'Jésus est entré avec Son propre sang.']];
 let sel=null,n=0;const bk=E('div','bank'),fb=E('p','fbk','Touche un mot, puis la bonne colonne.'),w=E('div','sw');
 const ct=['Ancien Testament','Jésus-Christ'].map((t,k)=>{const c=E('div','sc','<h3>'+t+'</h3>');c.onclick=()=>{if(sel===null){fb.textContent='Commence par toucher un mot.';return}
  const x=it[sel];if(x[1]===k){chs[sel].disabled=true;chs[sel].classList.remove('sel');c.append(E('div','si',x[0]));fb.className='fbk good';fb.innerHTML='<b>Bravo !</b> '+x[2];sel=null;if(++n==it.length)fb.innerHTML+='<br><b>La mort de Jésus a mis fin aux sacrifices d’animaux : il est le sacrifice parfait et définitif.</b>'}
  else{shk(c);fb.className='fbk bad';fb.textContent='Pas dans cette colonne… réessaie !'}};return c});
 const chs=it.map((x,i)=>{const b=E('button','gb chip',x[0]);b.onclick=()=>{if(b.disabled)return;chs.forEach(y=>y.classList.remove('sel'));b.classList.add('sel');sel=i;fb.className='fbk';fb.textContent='Maintenant, choisis la bonne colonne.'};return b});
 sh(chs).forEach(b=>bk.append(b));w.append(...ct);h.append(bk,w,fb)},
verse(h){
 const w=['Il est entré une fois pour toutes','dans le lieu très saint,','non avec le sang des boucs et des veaux,','mais avec son propre sang,','ayant obtenu une rédemption éternelle.'];
 const bt=E('div','built'),bk=E('div','bank'),win=E('p','fbk good'),ag=E('button','ag','Recommencer');let p=0;
 const setup=()=>{bt.textContent='';bk.innerHTML='';win.hidden=true;p=0;sh(w).forEach(x=>{const b=E('button','gb chip',x);b.onclick=()=>{if(b.disabled)return;
  if(x===w[p]){b.disabled=true;bt.textContent+=(p?' ':'')+x;if(++p==w.length){bt.textContent='« '+bt.textContent+' »';win.innerHTML='<b>Bravo !</b> Jésus a offert son sacrifice une seule fois. <i>(Hébreux 9:12)</i>';win.hidden=false}}else shk(b)};bk.append(b)})};
 ag.onclick=setup;h.append(bt,bk,win,ag);setup()}
};
const P={
'Jeu 1 · Relie les sacrifices à Jésus':'Les élèves choisissent un sacrifice à gauche, puis ce qu’il nous fait comprendre de Jésus à droite. Après chaque bonne réponse, une phrase du cours s’affiche : lis-la à voix haute.',
'Jeu 2 · Ancien Testament ou Jésus ?':'Ils rangent chaque mot dans la bonne colonne (Ancien Testament ou Jésus-Christ). À la fin, une phrase résume : la mort de Jésus a mis fin aux sacrifices d’animaux.',
'Jeu 3 · Le verset à retenir':'Verset : Hébreux 9:12, en entier, découpé en 5 groupes de mots (des « bulles ») pour rester simple. Les élèves les touchent dans l’ordre ; ils sont mélangés à chaque partie.',
'Le plan du cours':'Le chapitre 1 a expliqué pourquoi l’homme avait besoin d’un Rédempteur. Ici, on ne refait pas le péché : on montre comment l’Ancien Testament préparait à comprendre le sacrifice du Christ.',
'D’où viennent les sacrifices ?':'Le cours : la Croix était dans la pensée de Dieu depuis l’éternité ; avant la venue de Jésus, la pensée humaine a été préparée par de nombreuses indications et symboles. Les sacrifices sont l’un des plus importants, de Caïn et Abel jusqu’à leurs formes détaillées. Le Lévitique est un livre de Moïse : ses lois concernent les prêtres et les Lévites (tribu de Lévi, mis à part par Dieu pour le culte). Le cours ne détaille pas l’histoire de Caïn et Abel : reste à « les sacrifices existent depuis eux ». Le verset Ésaïe 53:10 vient du tableau sur le sacrifice de culpabilité : le cours dit que le bélier de ce sacrifice symbolise le Seigneur Jésus-Christ qui « s’est fait lui-même sacrifice de culpabilité ». C’est la lecture du cours ; vérifie la formulation dans ta Bible. Si un élève demande : c’est le sacrifice pour les fautes, on le verra à la slide « La culpabilité ».',
'Pourquoi des sacrifices ?':'Quand l’homme apporte l’animal, il comprend qu’il est en tort, qu’il mérite la mort à cause de son péché, et qu’il a attristé le cœur de Dieu. Le péché a deux conséquences : il attriste Dieu (montré par l’holocauste) et il détruit l’homme et le fait souffrir (montré par le sacrifice de culpabilité). But des sacrifices : l’expiation du péché, la purification de toute impureté, l’obtention du pardon. Le cours ne définit pas le mot « expiation » : il explique seulement qu’une âme innocente rachète une âme qui mérite la mort.',
'Pourquoi un animal innocent ?':'La personne pose la main sur la tête de l’animal et confesse ses péchés : ils sont transférés sur lui. L’âme innocente porte le péché, en symbole du Christ (1 Pierre 2:24). Sans effusion de sang, il n’y a pas de pardon (Hébreux 9:22).',
'Comment se passait un sacrifice ?':'Animaux : bœufs, moutons, chèvres ; pour les pauvres, colombes ou pigeons. Tous les sacrifices sont présentés à l’entrée de la Tente de la Rencontre : pas d’accès au sanctuaire sans le sang. Le sang est d’abord aspergé autour de l’autel : le culte repose sur le sang. Pour nous, c’est le sang de Jésus qui purifie de tout péché (1 Jean 1:7).',
'L’holocauste':'C’est le premier des sacrifices. Le bœuf pour ceux qui en ont les moyens, le mouton pour ceux qui en ont moins. Le prêtre place du bois sur l’autel puis le feu ; les morceaux sont posés sur le bois, symbole de la croix. L’animal est présenté à l’entrée de la Tente, pas à l’intérieur : le Christ a été crucifié hors de Jérusalem.',
'L’offrande':'Le cours donne un verset pour la farine, l’huile, l’encens et le sel (pas pour le feu, le pot d’argile ni le levain). Offrande non sanglante. Elle est sans levain (le levain symbolise le péché) et sans miel (les plaisirs et les convoitises). La farine broyée rappelle les souffrances : « Il a été meurtri pour nos iniquités ». Sans incarnation, il ne pouvait y avoir ni crucifixion ni rédemption.',
'L’action de grâces / la paix':'C’est le seul sacrifice dont mangent le prêtre, celui qui l’offre et ses amis. La graisse, meilleure part, est offerte au Seigneur : nous devons lui offrir toute notre énergie et tout ce que nous possédons. Elle est brûlée avec l’holocauste : prolongement du sacrifice de la Croix. À l’église (pendant la messe), la prière de Réconciliation symbolise la réconciliation entre Dieu et l’humanité. Lien avec l’Eucharistie, en simple : le cours dit que ce sacrifice annonce l’Eucharistie, sacrement d’action de grâce pour le sacrifice de Jésus ; sa graisse est brûlée sur l’holocauste, donc il prolonge le sacrifice de la Croix.',
'L’expiation':'L’animal varie selon la personne : taureau pour le grand prêtre et l’assemblée, bouc pour le chef, chèvre pour toute personne du peuple, deux tourterelles ou pigeonneaux pour le pauvre. Le prêtre asperge sept fois le sang sur le voile : signe de pardon total. Le sacrifice est brûlé hors du camp, loin du Saint des Saints.',
'La culpabilité':'Le cours explique que le péché a deux aspects et que les sacrifices d’expiation et de culpabilité ont une même loi. Pour la culpabilité : un bélier sans défaut, plus un paiement pour réparer le tort (le cours rappelle Zachée). Jésus a réuni en lui ces deux sacrifices.',
'Pourquoi Jésus devait-Il venir ?':'La répétition quotidienne du sang montre son insuffisance. Il fallait un sacrifice offert une seule fois : celui du Christ. Sa mort a mis fin aux sacrifices d’animaux.',
'Aujourd’hui, à l’église':'Tout vient du cours. Sur la Fraction, le cours dit en entier « le prêtre divise le Corps en plusieurs parties, puis il y dépose du Sang, de sorte qu’il est recouvert de Sang » ; je n’ai gardé que « divise… puis y dépose du Sang ». Le cours ne parle pas de la communion en dehors de ce passage : à vérifier avec ton prêtre si besoin.',
};
const app=document.getElementById('app');let i=0,st=0,rv=[];
function note(){const n=S[i+1],p=P[S[i][0]];nt.innerHTML=`<b>À dire :</b> ${S[i][2]}${p?`<br><b>Pour toi :</b> ${p}`:''}<br><b>${rv.length?`Clic ${st}/${rv.length} · `:''}Ensuite :</b> ${n?n[0]:'fin du cours'}`}
function upd(){pv.disabled=i==0&&st==0;nx.disabled=i==S.length-1&&st==rv.length;note()}
function show(n,full){i=n;app.innerHTML=`<section class="sl">${S[n][1]}</section>`;app.querySelectorAll('[data-g]').forEach(h=>GM[h.dataset.g](h));app.querySelectorAll('.rv').forEach(e=>e.classList.add('on'));rv=[...app.querySelectorAll('.hd')];st=full?rv.length:0;rv.slice(0,st).forEach(e=>e.classList.add('on'));app.scrollTop=0;ct.textContent=`${n+1} / ${S.length}`;pb.style.width=(n+1)/S.length*100+'%';upd()}
function next(){if(st<rv.length)rv[st++].classList.add('on');else if(i<S.length-1)return show(i+1);upd()}
function prev(){if(st>0)rv[--st].classList.remove('on');else if(i>0)return show(i-1,1);upd()}
nx.onclick=next;pv.onclick=prev;
tn.onclick=()=>{nt.classList.toggle('on');tn.setAttribute('aria-pressed',nt.classList.contains('on'))};
const tg=t=>{t.classList.toggle('op');const k=t.dataset.k;if(k)app.querySelectorAll('.tl[data-k="'+k+'"]').forEach(x=>x.classList.toggle('on',t.classList.contains('op')))};
app.onclick=e=>{const t=e.target.closest('.qz');if(t)tg(t)};
document.onkeydown=e=>{if(e.target.closest&&e.target.closest('.gb'))return;const q=e.target.closest&&e.target.closest('.qz');if(q&&(e.key=='Enter'||e.key==' ')){e.preventDefault();return tg(q)}
if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key=='n')tn.click()};
show(0);
</script></body></html>
