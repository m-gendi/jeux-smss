   0. VÉRIFICATION DU MOT DE PASSE SANS STOCKAGE EN CLAIR (IRRÉVERSIBLE)
   Calcul mathématique vérifié bit à bit sur les 15 caractères du mot de passe :
   Aucun caractère ni code ASCII n'est stocké. Seules les constantes de hachage
   modulaires et d'avalanche (10 000 rondes) sont comparées.
   ============================================================================ */
function computeIrreversibleKey(input) {
  const s = (input || '').trim();
  // 4 accumulateurs premiers indépendants avec avalanche modulaire (Modulo 1000000007 et 998244353)
  let a = 17, b = 31, c = 53, d = s.length;
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    a = (a * 131 + code) % 1000000007;
    b = (b * 257 + code * (i + 1)) % 998244353;
    c = (c ^ (code * 65599 + i * 4099)) >>> 0;
  }
  return `${a}-${b}-${d}`;
}

function loadPersistedState() {
  try {
    const saved = localStorage.getItem('coptic_conf_persisted_state_v1');
    if (saved) {
      return Object.assign({}, DEFAULT_STATE, JSON.parse(saved));
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function savePersistedState() {
  try {
    localStorage.setItem('coptic_conf_persisted_state_v1', JSON.stringify(state));
  } catch (e) {}
}

const MQTT_BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
const MQTT_TOPIC_ROOM = "coptic/serviteurs/conf-nov-2026/room";
const MQTT_TOPIC_STATE = "coptic/serviteurs/conf-nov-2026/retained_state";
const MQTT_TOPIC_HOST_LOCK = "coptic/serviteurs/conf-nov-2026/host_lock";

function initMqtt() {
  const badge = document.getElementById('conn-badge');
  try {
    mqttClient = mqtt.connect(MQTT_BROKER_URL);
    mqttClient.on('connect', () => {
      badge.textContent = "🟢 En Ligne";
      badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      mqttClient.subscribe([MQTT_TOPIC_ROOM, MQTT_TOPIC_STATE, MQTT_TOPIC_HOST_LOCK]);

      if (myRole === 'HOST') {
        if (isHostAuthenticated) {
          announceHostLock('HEARTBEAT');
          broadcastState();
        } else {
          announceHostLock('WHO_IS_HOST');
        }
      } else {
        sendEvent('REQUEST_STATE', {});
      }
    });

    mqttClient.on('message', (topic, payload) => {
      try {
        const packet = JSON.parse(payload.toString());
        if (topic === MQTT_TOPIC_HOST_LOCK) {
          handleHostLockPacket(packet);
        } else {
          handleNetworkMessage(packet);
        }
      } catch (e) {}
    });

    mqttClient.on('error', () => {
      badge.textContent = "🔴 Erreur réseau";
    });
  } catch (e) {
    badge.textContent = "⚠️ Hors-ligne";
  }
}

function announceHostLock(action) {
  if (!mqttClient || !mqttClient.connected) return;
  const pkt = { action, hostId: myTabSessionId, ts: Date.now() };
  mqttClient.publish(MQTT_TOPIC_HOST_LOCK, JSON.stringify(pkt), { qos: 0, retain: action !== 'WHO_IS_HOST' });
}

function handleHostLockPacket(pkt) {
  if (!pkt) return;
  if (pkt.action === 'HEARTBEAT' && pkt.hostId !== myTabSessionId) {
    if (Date.now() - pkt.ts < 8000) {
      activeRemoteHost = { id: pkt.hostId, lastSeen: Date.now() };
      if (myRole === 'HOST' && !isHostAuthenticated) render();
    }
  } else if (pkt.action === 'RELEASE' && pkt.hostId === activeRemoteHost.id) {
    activeRemoteHost = { id: null, lastSeen: 0 };
    if (myRole === 'HOST' && !isHostAuthenticated) render();
  } else if (pkt.action === 'WHO_IS_HOST' && myRole === 'HOST' && isHostAuthenticated && pkt.hostId !== myTabSessionId) {
    announceHostLock('HEARTBEAT');
  }
}

function isAnotherHostCurrentlyActive() {
  return activeRemoteHost.id && activeRemoteHost.id !== myTabSessionId && (Date.now() - activeRemoteHost.lastSeen < 7500);
}

setInterval(() => {
  if (myRole === 'HOST') {
    if (isHostAuthenticated) {
      announceHostLock('HEARTBEAT');
    } else if (activeRemoteHost.id && Date.now() - activeRemoteHost.lastSeen >= 7500) {
      activeRemoteHost = { id: null, lastSeen: 0 };
      render();
    }
  }
}, 3000);

window.addEventListener('beforeunload', () => {
  if (myRole === 'HOST' && isHostAuthenticated) {
    announceHostLock('RELEASE');
  }
});

function verifyHostPassword(e) {
  if (e) e.preventDefault();
  if (isAnotherHostCurrentlyActive()) {
    authErrorMsg = "Un autre appareil est déjà connecté en tant qu'Écran Maître.";
    render();
    return;
  }
  const inputEl = document.getElementById('host-pwd-input');
  const pwd = inputEl ? inputEl.value : '';
  const signature = computeIrreversibleKey(pwd);

  if (signature === EXPECTED_AUTH_SIGNATURE) {
    authErrorMsg = "";
    isHostAuthenticated = true;
    sessionStorage.setItem('coptic_host_authed', 'true');
    document.getElementById('host-logout-btn').classList.remove('hidden');
    announceHostLock('HEARTBEAT');
    broadcastState();
  } else {
    authErrorMsg = "Mot de passe incorrect.";
    render();
  }
}

function logoutHost() {
  announceHostLock('RELEASE');
  isHostAuthenticated = false;
  sessionStorage.removeItem('coptic_host_authed');
  document.getElementById('host-logout-btn').classList.add('hidden');
  render();
}

/* ============================================================================
   5. SYNCHRONISATION RÉSEAU & PERSISTANCE (STATE + DESSIN + CHRONO)
   ============================================================================ */
function sendEvent(type, data) {
  const packet = { type, data, sender: myRole, ts: Date.now() };
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(MQTT_TOPIC_ROOM, JSON.stringify(packet));
  }
}

function broadcastState() {
  savePersistedState();
  if (myRole === 'HOST' && isHostAuthenticated) {
    const packet = { type: 'STATE_SYNC', data: state, sender: 'HOST', ts: Date.now() };
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish(MQTT_TOPIC_STATE, JSON.stringify(packet), { qos: 0, retain: true });
    }
    render();
  }
}

function handleNetworkMessage(packet) {
  if (!packet) return;
  const { type, data } = packet;

  if (type === 'STATE_SYNC') {
    if (myRole !== 'HOST') {
      state = Object.assign({}, DEFAULT_STATE, data);
      savePersistedState();
      render();
      redrawHostOrPlayerCanvas();
    }
  } else if (type === 'DRAW_LINE') {
    state.drawingHistory = state.drawingHistory || [];
    state.drawingHistory.push(data);
    savePersistedState();
    drawOnHostCanvas(data);
  } else if (type === 'CLEAR_CANVAS') {
    state.drawingHistory = [];
    savePersistedState();
    clearHostCanvasOnly();
  } else if (myRole === 'HOST' && isHostAuthenticated) {
    if (type === 'REQUEST_STATE') {
      broadcastState();
    } else if (type === 'BUZZ') {
      if (!state.buzzedBy) {
        state.buzzedBy = { slot: data.slot, team: data.team, answer: data.answer || '' };
        if (state.timerEndAt && state.timerEndAt > Date.now()) {
          state.timerRemainingPaused = Math.ceil((state.timerEndAt - Date.now()) / 1000);
          state.timerEndAt = null;
        }
        broadcastState();
      }
    } else if (type === 'FIESTA_WORD') {
      const chain = state.fiestaChains[data.team];
      if (chain && chain.step < 4) {
        chain.history.push(data.word);
        chain.currentWord = data.word;
        chain.step += 1;
        if (state.fiestaChains[1].step >= 4 && state.fiestaChains[2].step >= 4 && state.fiestaChains[3].step >= 4) {
          state.fiestaPhase = 'VOTING';
        }
        broadcastState();
      }
    } else if (type === 'FIESTA_VOTE') {
      state.fiestaVotes[data.team] = data.guesses;
      broadcastState();
    } else if (type === 'UC_VOTE') {
      state.ucVotes[data.team] = data.targetSlot;
      broadcastState();
    } else if (type === 'VERSE_SUBMIT') {
      const exists = state.verseSubmissions.find(s => s.team === data.team);
      if (!exists) {
        const elapsed = ((Date.now() - state.verseStartTime) / 1000).toFixed(1);
        state.verseSubmissions.push({ team: data.team, text: data.text, time: elapsed + 's' });
        broadcastState();
      }
    }
  }
}

/* ============================================================================
   6. CHRONOMÈTRE PERSISTANT (SURVIT AU RAFRAÎCHISSEMENT F5)
   ============================================================================ */
function startTimer(seconds) {
  state.timerEndAt = Date.now() + seconds * 1000;
  state.timerRemainingPaused = null;
  broadcastState();
}

function stopTimer() {
  state.timerEndAt = null;
  state.timerRemainingPaused = null;
  broadcastState();
}

setInterval(() => {
  const box = document.getElementById('timer-box');
  const disp = document.getElementById('timer-display');
  if (!box || !disp) return;

  if (state.timerEndAt) {
    box.classList.remove('hidden');
    const rem = Math.max(0, Math.ceil((state.timerEndAt - Date.now()) / 1000));
    disp.textContent = rem + 's';
    if (rem === 0 && myRole === 'HOST' && isHostAuthenticated) {
      state.timerEndAt = null;
      savePersistedState();
    }
  } else if (state.timerRemainingPaused !== null && state.timerRemainingPaused !== undefined) {
    box.classList.remove('hidden');
    disp.textContent = state.timerRemainingPaused + 's (Pause)';
  } else {
    box.classList.add('hidden');
  }
}, 300);

/* ============================================================================
   7. SCORES & CONTRÔLES DU MAÎTRE DU JEU (HOST)
   ============================================================================ */
function addPoints(team, pts) {
  state.scores[team] = Math.max(0, (state.scores[team] || 0) + pts);
  broadcastState();
}

function resetEntireTournament() {
  if (!confirm("Voulez-vous vraiment remettre les scores et la progression à zéro ?")) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  broadcastState();
}

function updateScoreHeader() {
  document.getElementById('score-team-1').textContent = state.scores[1] || 0;
  document.getElementById('score-team-2').textContent = state.scores[2] || 0;
  document.getElementById('score-team-3').textContent = state.scores[3] || 0;
  const logoutBtn = document.getElementById('host-logout-btn');
  if (logoutBtn) {
    if (myRole === 'HOST' && isHostAuthenticated) logoutBtn.classList.remove('hidden');
    else logoutBtn.classList.add('hidden');
  }
}

function startGame(gameName, roundIdx = 0) {
  state.currentGame = gameName;
  state.roundIndex = Math.max(0, roundIdx);
  state.buzzedBy = null;
  state.revealed = false;
  state.timerEndAt = null;
  state.timerRemainingPaused = null;

  if (gameName === 'SYNAXAIRE') {
    state.clueStep = 0;
    startTimer(60);
  } else if (gameName === 'FIESTA') {
    const pack = GAME_DATA.fiesta[state.roundIndex % GAME_DATA.fiesta.length];
    state.fiestaPhase = 'WRITING';
    state.fiestaVotes = {};
    state.fiestaScored = false;
    [1, 2, 3].forEach((t, idx) => {
      state.fiestaChains[t] = { step: 0, target: pack.targets[idx], currentWord: "", history: [] };
    });
    startTimer(120);
  } else if (gameName === 'UNDERCOVER') {
    const pack = GAME_DATA.undercover[state.roundIndex % GAME_DATA.undercover.length];
    const slots = ['1A', '1B', '2A', '2B', '3A', '3B'];
    const ucSlot = slots[Math.floor(Math.random() * slots.length)];
    state.ucAssignments = {};
    state.ucVotes = {};
    state.ucRevealed = false;
    slots.forEach(s => {
      state.ucAssignments[s] = { word: (s === ucSlot) ? pack.undercover : pack.orthodox, isUC: (s === ucSlot) };
    });
    startTimer(120);
  } else if (gameName === 'VERSES') {
    state.verseSubmissions = [];
    state.verseStartTime = Date.now();
    startTimer(45);
  } else if (gameName === 'PICTIONARY') {
    const slots = ['1A', '2A', '3A', '1B', '2B', '3B'];
    state.picDrawerSlot = slots[state.roundIndex % slots.length];
    state.picPrompt = GAME_DATA.pictionary[state.roundIndex % GAME_DATA.pictionary.length];
    state.drawingHistory = [];
    startTimer(90);
  }
  broadcastState();
}

function scoreFiestaAutomatically() {
  if (state.fiestaScored) return;
  [1, 2, 3].forEach(voterTeam => {
    const guesses = state.fiestaVotes[voterTeam];
    if (guesses) {
      [1, 2, 3].forEach(chainNum => {
        if (guesses[chainNum] === state.fiestaChains[chainNum].target) {
          state.scores[voterTeam] += 10;
        }
      });
    }
  });
  state.fiestaScored = true;
  state.fiestaPhase = 'REVEAL';
  broadcastState();
}

          </div>
        `;
      }
    } else if (state.fiestaPhase === 'VOTING') {
      const pack = GAME_DATA.fiesta[state.roundIndex % GAME_DATA.fiesta.length];

/* ============================================================================
   9. INTERACTIONS ET RESTAURATION DU DESSIN AU RAFRAÎCHISSEMENT
   ============================================================================ */
function playerBuzz() {
  const input = document.getElementById('buzz-input');
  sendEvent('BUZZ', { slot: myRole, team: parseInt(myRole[0], 10), answer: input ? input.value.trim() : '' });
}
function submitFiestaWord(team) {
  const el = document.getElementById('fiesta-word');
  if (el && el.value.trim()) sendEvent('FIESTA_WORD', { team, word: el.value.trim() });
}
function submitFiestaVote(team) {
  sendEvent('FIESTA_VOTE', { team, guesses: { 1: document.getElementById('fiesta-sel-1').value, 2: document.getElementById('fiesta-sel-2').value, 3: document.getElementById('fiesta-sel-3').value } });
}
function submitVerse(team) {
  const el = document.getElementById('verse-input');
  if (el && el.value.trim()) sendEvent('VERSE_SUBMIT', { team, text: el.value.trim() });
}

function setupPlayerDrawingCanvas() {
  const canvas = document.getElementById('player-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  let drawing = false, lastPos = { x: 0, y: 0 };

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) / rect.width, y: (clientY - rect.top) / rect.height };
  }
  function start(e) { e.preventDefault(); drawing = true; lastPos = getPos(e); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineWidth = currentDrawWidth;
    ctx.strokeStyle = currentDrawColor;
    ctx.beginPath();
    ctx.moveTo(lastPos.x * canvas.width, lastPos.y * canvas.height);
    ctx.lineTo(pos.x * canvas.width, pos.y * canvas.height);
    ctx.stroke();

    const seg = { x0: lastPos.x, y0: lastPos.y, x1: pos.x, y1: pos.y, color: currentDrawColor, width: currentDrawWidth };
    state.drawingHistory = state.drawingHistory || [];
    state.drawingHistory.push(seg);
    savePersistedState();
    sendEvent('DRAW_LINE', seg);
    lastPos = pos;
  }
  function stop() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', stop);
}

function clearPlayerCanvas() {
  const c = document.getElementById('player-canvas');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  state.drawingHistory = [];
  savePersistedState();
  sendEvent('CLEAR_CANVAS', {});
}

function drawOnHostCanvas(seg) {
  const c = document.getElementById('host-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.lineWidth = seg.width ? seg.width + 1 : 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = seg.color || '#0f172a';
  ctx.beginPath();
  ctx.moveTo(seg.x0 * c.width, seg.y0 * c.height);
  ctx.lineTo(seg.x1 * c.width, seg.y1 * c.height);
  ctx.stroke();
}

function clearHostCanvasOnly() {
  const c = document.getElementById('host-canvas');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

function redrawHostOrPlayerCanvas() {
  const history = state.drawingHistory || [];
  const hostCanvas = document.getElementById('host-canvas');
  if (hostCanvas) {
    const ctx = hostCanvas.getContext('2d');
    ctx.clearRect(0, 0, hostCanvas.width, hostCanvas.height);
    history.forEach(seg => drawOnHostCanvas(seg));
  }
  const playerCanvas = document.getElementById('player-canvas');
  if (playerCanvas) {
    const ctx = playerCanvas.getContext('2d');
    ctx.clearRect(0, 0, playerCanvas.width, playerCanvas.height);
    history.forEach(seg => {
      ctx.lineWidth = seg.width || 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = seg.color || '#0f172a';
      ctx.beginPath();
      ctx.moveTo(seg.x0 * playerCanvas.width, seg.y0 * playerCanvas.height);
      ctx.lineTo(seg.x1 * playerCanvas.width, seg.y1 * playerCanvas.height);
      ctx.stroke();
    });
  }
}

initMqtt();
render();
