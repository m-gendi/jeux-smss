/* ============================================================================
   2. ÉTAT GLOBAL & MQTT
   ============================================================================ */
let myRole = localStorage.getItem('coptic_game_role') || null;
let state = {
  scores: { 1: 0, 2: 0, 3: 0 },
  currentGame: 'LOBBY',
  roundIndex: 0,
  clueStep: 0,
  buzzedBy: null,
  revealed: false,
  fiestaChains: {
    1: { step: 0, target: "", currentWord: "", history: [] },
    2: { step: 0, target: "", currentWord: "", history: [] },
    3: { step: 0, target: "", currentWord: "", history: [] }
  },
  fiestaPhase: 'WRITING',
  fiestaVotes: {},
  fiestaScored: false,
  ucAssignments: {},
  ucVotes: {},
  ucRevealed: false,
  verseSubmissions: [],
  verseStartTime: 0,
  picDrawerSlot: '1A',
  picPrompt: ''
};

let currentDrawColor = '#0f172a';
let currentDrawWidth = 3;
let mqttClient = null;

// Broker MQTT public et hautement performant (zéro configuration)
const MQTT_BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
const MQTT_TOPIC = "coptic/serviteurs/conf/2026/room";

function initMqtt() {
  const badge = document.getElementById('conn-badge');
  try {
    mqttClient = mqtt.connect(MQTT_BROKER_URL);
    mqttClient.on('connect', () => {
      badge.textContent = "🟢 Temps Réel Connecté";
      badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      mqttClient.subscribe(MQTT_TOPIC);
      if (myRole && myRole !== 'HOST') sendEvent('REQUEST_STATE', {});
    });
    mqttClient.on('message', (topic, payload) => {
      try {
        const packet = JSON.parse(payload.toString());
        handleNetworkMessage(packet);
      } catch(e){}
    });
    mqttClient.on('error', () => {
      badge.textContent = "🔴 Erreur réseau";
    });
  } catch(e) {
    badge.textContent = "⚠️ Mode hors-ligne";
  }
}

function sendEvent(type, data) {
  const packet = { type, data, sender: myRole, ts: Date.now() };
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(MQTT_TOPIC, JSON.stringify(packet));
  }
}

function broadcastState() {
  if (myRole === 'HOST') {
    sendEvent('STATE_SYNC', state);
    render();
  }
}

function handleNetworkMessage(packet) {
  if (!packet) return;
  const { type, data } = packet;

  if (type === 'STATE_SYNC') {
    state = data;
    render();
  } else if (type === 'DRAW_LINE') {
    drawOnHostCanvas(data);
  } else if (type === 'CLEAR_CANVAS') {
    clearHostCanvas();
  } else if (myRole === 'HOST') {
    if (type === 'REQUEST_STATE') {
      broadcastState();
    } else if (type === 'BUZZ') {
      if (!state.buzzedBy) {
        state.buzzedBy = { slot: data.slot, team: data.team, answer: data.answer || '' };
        broadcastState();
      }
    } else if (type === 'FIESTA_WORD') {
      const chain = state.fiestaChains[data.team];
      if (chain && chain.step < 4) {
        chain.history.push(data.word);
        chain.currentWord = data.word;
        chain.step += 1;
        if (state.fiestaChains[1].step >= 4 && state.fiestaChains[2].step >= 4 && state.fiestaChains[3].step >= 4) {
          state.fiestaPhase = 'VOTING';
        }
        broadcastState();
      }
    } else if (type === 'FIESTA_VOTE') {
      state.fiestaVotes[data.team] = data.guesses;
      broadcastState();
    } else if (type === 'UC_VOTE') {
      state.ucVotes[data.team] = data.targetSlot;
      broadcastState();
    } else if (type === 'VERSE_SUBMIT') {
      const exists = state.verseSubmissions.find(s => s.team === data.team);
      if (!exists) {
        const elapsed = ((Date.now() - state.verseStartTime) / 1000).toFixed(1);
        state.verseSubmissions.push({ team: data.team, text: data.text, time: elapsed + 's' });
        broadcastState();
      }
    }
  }
}

/* ============================================================================
   3. GESTION DES RÔLES & SCORES
   ============================================================================ */
function selectRole(role) {
  myRole = role;
  localStorage.setItem('coptic_game_role', role);
  if (role !== 'HOST') sendEvent('REQUEST_STATE', {});
  render();
}

function resetRole() {
  localStorage.removeItem('coptic_game_role');
  myRole = null;
  render();
}

function addPoints(team, pts) {
  state.scores[team] = Math.max(0, (state.scores[team] || 0) + pts);
  broadcastState();
}

function updateScoreHeader() {
  document.getElementById('score-team-1').textContent = state.scores[1] || 0;
  document.getElementById('score-team-2').textContent = state.scores[2] || 0;
  document.getElementById('score-team-3').textContent = state.scores[3] || 0;
}

/* ============================================================================
   4. CONTRÔLES DU MAÎTRE DU JEU (HOST)
   ============================================================================ */
function startGame(gameName, roundIdx = 0) {
  state.currentGame = gameName;
  state.roundIndex = Math.max(0, roundIdx);
  state.buzzedBy = null;
  state.revealed = false;

  if (gameName === 'SYNAXAIRE') {
    state.clueStep = 0;
  } else if (gameName === 'FIESTA') {
    const pack = GAME_DATA.fiesta[state.roundIndex % GAME_DATA.fiesta.length];
    state.fiestaPhase = 'WRITING';
    state.fiestaVotes = {};
    state.fiestaScored = false;
    [1, 2, 3].forEach((t, idx) => {
      state.fiestaChains[t] = { step: 0, target: pack.targets[idx], currentWord: "", history: [] };
    });
  } else if (gameName === 'UNDERCOVER') {
    const pack = GAME_DATA.undercover[state.roundIndex % GAME_DATA.undercover.length];
    const slots = ['1A', '1B', '2A', '2B', '3A', '3B'];
    const ucSlot = slots[Math.floor(Math.random() * slots.length)];
    state.ucAssignments = {};
    state.ucVotes = {};
    state.ucRevealed = false;
    slots.forEach(s => {
      state.ucAssignments[s] = { word: (s === ucSlot) ? pack.undercover : pack.orthodox, isUC: (s === ucSlot) };
    });
  } else if (gameName === 'VERSES') {
    state.verseSubmissions = [];
    state.verseStartTime = Date.now();
  } else if (gameName === 'PICTIONARY') {
    const slots = ['1A', '2A', '3A', '1B', '2B', '3B'];
    state.picDrawerSlot = slots[state.roundIndex % slots.length];
    state.picPrompt = GAME_DATA.pictionary[state.roundIndex % GAME_DATA.pictionary.length];
  }
  broadcastState();
}

function scoreFiestaAutomatically() {
  if (state.fiestaScored) return;
  [1, 2, 3].forEach(voterTeam => {
    const guesses = state.fiestaVotes[voterTeam];
    if (guesses) {
      [1, 2, 3].forEach(chainNum => {
        if (guesses[chainNum] === state.fiestaChains[chainNum].target) {
          state.scores[voterTeam] += 10;
        }
      });
    }
  });
  state.fiestaScored = true;
  state.fiestaPhase = 'REVEAL';
  broadcastState();
}

        body = `
          <div class="space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl text-center border border-slate-700"><div class="text-xs uppercase text-slate-400 font-bold">Serviteur ${chain.step + 1} / 4</div><div class="mt-2 text-sm text-slate-200">${promptLabel}</div></div>
            <input id="fiesta-word" type="text" placeholder="UN SEUL mot indice..." class="w-full bg-slate-800 border border-amber-500/50 rounded-xl px-4 py-3 text-white text-lg">
            <button onclick="submitFiestaWord(${myTeam})" class="w-full py-4 bg-amber-600 rounded-xl font-extrabold text-slate-950">Valider & Passer le mobile ➔</button>
          </div>
        `;
      }
    } else if (state.fiestaPhase === 'VOTING') {
      const pack = GAME_DATA.fiesta[state.roundIndex % GAME_DATA.fiesta.length];
      const allOptions = [...pack.targets, ...pack.decoys].sort();
      body = `
        <div class="space-y-4">
          <div class="text-sm font-bold text-amber-400">Associez les mots finaux :</div>
          ${[1, 2, 3].map(idx => `<div class="bg-slate-800 p-3 rounded-xl space-y-1"><label class="text-xs text-slate-300 block">Mot n°${idx} : <strong>« ${state.fiestaChains[idx].currentWord} »</strong></label><select id="fiesta-sel-${idx}" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white">${allOptions.map(o => `<option value="${o}">${o}</option>`).join('')}</select></div>`).join('')}
          <button onclick="submitFiestaVote(${myTeam})" class="w-full py-3 bg-emerald-600 rounded-xl font-bold text-white">Envoyer le vote</button>
        </div>
      `;
    } else {
      body = `<div class="text-center py-8 text-sm text-slate-300">Regardez les résultats sur le grand écran !</div>`;
    }
  } else if (state.currentGame === 'UNDERCOVER') {
    const myInfo = state.ucAssignments[myRole] || { word: '...' };
    const slots = ['1A', '1B', '2A', '2B', '3A', '3B'];
    body = `
      <div class="space-y-5">
        <div class="bg-slate-800 border-2 border-amber-500/50 rounded-2xl p-5 text-center space-y-2">
          <div class="text-xs uppercase text-slate-400 font-bold">Votre Mot Secret (Gardez-le caché)</div>
          <div class="text-2xl font-extrabold text-amber-300">${myInfo.word}</div>
        </div>
        ${isCaptain ? `
          <div class="bg-slate-800/70 p-4 rounded-xl space-y-2 border border-slate-700">
            <div class="text-xs uppercase font-bold text-slate-300">Qui est l'infiltré ?</div>
            <div class="grid grid-cols-3 gap-2">
              ${slots.map(s => `<button onclick="sendEvent('UC_VOTE', { team: ${myTeam}, targetSlot: '${s}' })" class="py-2.5 rounded-lg font-bold text-xs ${state.ucVotes[myTeam]===s ? 'bg-rose-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-600'}">Joueur ${s}</button>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  } else if (state.currentGame === 'VERSES') {
    if (!isCaptain) {
      body = `<div class="text-center py-8 text-sm text-slate-300">Aidez votre capitaine à taper les mots manquants !</div>`;
    } else {
      const alreadySent = state.verseSubmissions.find(s => s.team === myTeam);
      body = alreadySent ? `<div class="text-center py-8 text-emerald-400 font-bold">✅ Réponse envoyée !</div>` : `
        <div class="space-y-4">
          <div class="text-xs uppercase font-bold text-amber-400">Mots manquants :</div>
          <input id="verse-input" type="text" placeholder="Ex: charité, foi" class="w-full bg-slate-800 border border-amber-500/50 rounded-xl px-4 py-3 text-white text-lg">
          <button onclick="submitVerse(${myTeam})" class="w-full py-4 bg-emerald-600 rounded-xl font-extrabold text-white">Envoyer</button>
        </div>
      `;
    }
  } else if (state.currentGame === 'PICTIONARY') {
    if (myRole === state.picDrawerSlot) {
      body = `
        <div class="space-y-3">
          <div class="bg-amber-500/20 border border-amber-400 p-3 rounded-xl text-center">
            <div class="text-[11px] uppercase text-amber-300 font-bold">À vous de dessiner !</div>
            <div class="text-base font-extrabold text-white">${state.picPrompt}</div>
          </div>
          <div class="flex justify-between items-center bg-slate-800 p-2 rounded-lg">
            <div class="flex gap-2">
              <button onclick="currentDrawColor='#0f172a'" class="w-6 h-6 rounded-full bg-slate-950 border border-white"></button>
              <button onclick="currentDrawColor='#dc2626'" class="w-6 h-6 rounded-full bg-red-600 border border-white"></button>
              <button onclick="currentDrawColor='#d97706'" class="w-6 h-6 rounded-full bg-amber-600 border border-white"></button>
              <button onclick="currentDrawColor='#2563eb'" class="w-6 h-6 rounded-full bg-blue-600 border border-white"></button>
            </div>
            <button onclick="clearPlayerCanvas()" class="px-2.5 py-1 bg-rose-700 rounded text-xs font-bold text-white">Effacer</button>
          </div>
          <canvas id="player-canvas" width="340" height="240" class="bg-white rounded-xl mx-auto block border-2 border-amber-500"></canvas>
        </div>
      `;
    } else if (isCaptain) {
      const locked = state.buzzedBy !== null;
      body = `
        <div class="space-y-4">
          <div class="text-xs text-center text-slate-300">Terminal <strong>${state.picDrawerSlot}</strong> dessine !</div>
          <input id="buzz-input" type="text" placeholder="Réponse optionnelle..." class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white">
          <button ${locked ? 'disabled' : ''} onclick="playerBuzz()" class="w-full py-6 rounded-2xl font-extrabold text-xl ${locked ? 'bg-slate-700 text-slate-400' : 'bg-rose-600 text-white'}">🔔 BUZZER !</button>
        </div>
      `;
    } else {
      body = `<div class="text-center py-8 text-sm text-slate-300">Regardez le projecteur et soufflez la réponse !</div>`;
    }
  }

  root.innerHTML = `<div class="bg-slate-900/95 border border-slate-700 rounded-2xl p-5 max-w-md mx-auto w-full space-y-4 shadow-xl"><div class="flex justify-between items-center border-b border-slate-800 pb-2"><span class="font-extrabold text-amber-400">Terminal ${myRole}</span><span class="text-xs text-slate-400">${isCaptain ? 'Capitaine' : 'Second'}</span></div>${body}</div>`;

  if (state.currentGame === 'PICTIONARY' && myRole === state.picDrawerSlot) {
    setupPlayerDrawingCanvas();
  }
}

/* ============================================================================
   6. INTERACTIONS ET DESSIN
   ============================================================================ */
function playerBuzz() {
  const input = document.getElementById('buzz-input');
  sendEvent('BUZZ', { slot: myRole, team: parseInt(myRole[0], 10), answer: input ? input.value.trim() : '' });
}
function submitFiestaWord(team) {
  const el = document.getElementById('fiesta-word');
  if (el && el.value.trim()) sendEvent('FIESTA_WORD', { team, word: el.value.trim() });
}
function submitFiestaVote(team) {
  sendEvent('FIESTA_VOTE', { team, guesses: { 1: document.getElementById('fiesta-sel-1').value, 2: document.getElementById('fiesta-sel-2').value, 3: document.getElementById('fiesta-sel-3').value } });
}
function submitVerse(team) {
  const el = document.getElementById('verse-input');
  if (el && el.value.trim()) sendEvent('VERSE_SUBMIT', { team, text: el.value.trim() });
}

function setupPlayerDrawingCanvas() {
  const canvas = document.getElementById('player-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  let drawing = false, lastPos = { x: 0, y: 0 };

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) / rect.width, y: (clientY - rect.top) / rect.height };
  }
  function start(e) { e.preventDefault(); drawing = true; lastPos = getPos(e); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineWidth = currentDrawWidth;
    ctx.strokeStyle = currentDrawColor;
    ctx.beginPath();
    ctx.moveTo(lastPos.x * canvas.width, lastPos.y * canvas.height);
    ctx.lineTo(pos.x * canvas.width, pos.y * canvas.height);
    ctx.stroke();
    sendEvent('DRAW_LINE', { x0: lastPos.x, y0: lastPos.y, x1: pos.x, y1: pos.y, color: currentDrawColor, width: currentDrawWidth });
    lastPos = pos;
  }
  function stop() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', stop);
}

function clearPlayerCanvas() {
  const c = document.getElementById('player-canvas');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  sendEvent('CLEAR_CANVAS', {});
}

function drawOnHostCanvas(seg) {
  const c = document.getElementById('host-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.lineWidth = seg.width ? seg.width + 1 : 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = seg.color || '#0f172a';
  ctx.beginPath();
  ctx.moveTo(seg.x0 * c.width, seg.y0 * c.height);
  ctx.lineTo(seg.x1 * c.width, seg.y1 * c.height);
  ctx.stroke();
}

function clearHostCanvas() {
  const c = document.getElementById('host-canvas');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

// Lancement automatique
initMqtt();
render();
</script>
