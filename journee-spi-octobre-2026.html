    // SYNTHÉTISEUR AUDIO WEB API (100% autonome, sans fichiers externes)

    const useSoundEffects = () => {
      const [muted, setMuted] = useState(false);
      const audioCtxRef = useRef(null);

      const getContext = useCallback(() => {
        if (muted) return null;
        if (!audioCtxRef.current) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtxRef.current = new AudioContext();
          }
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      }, [muted]);

      const playPop = useCallback(() => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch (e) {}
      }, [getContext]);

      const playTick = useCallback((urgent = false) => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = urgent ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(urgent ? 780 : 440, ctx.currentTime);
          gain.gain.setValueAtTime(urgent ? 0.15 : 0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
      }, [getContext]);

      const playPressureStart = useCallback(() => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          [196, 185].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
            gain.gain.setValueAtTime(0.14, ctx.currentTime + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.14);
            osc.stop(ctx.currentTime + idx * 0.14 + 0.36);
          });
        } catch (e) {}
      }, [getContext]);

      const playReveal = useCallback((godDelta) => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          const notes = godDelta >= 20 ? [440, 554.37, 659.25, 880] : godDelta > 0 ? [440, 523.25, 659.25] : [330, 293.66, 246.94];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = godDelta >= 0 ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.16, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.36);
          });
        } catch (e) {}
      }, [getContext]);

      const playDrainTwist = useCallback(() => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(620, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 1.4);
          gain.gain.setValueAtTime(0.22, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1.5);
        } catch (e) {}
      }, [getContext]);

      const playSlide = useCallback(() => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(250, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.16);
        } catch (e) {}
      }, [getContext]);

      const playCrash = useCallback(() => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          // Onde sourde (impact)
          [150, 180].forEach(freq => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
          });
          // Bruit blanc d'impact
          const bufferSize = ctx.sampleRate * 0.2;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.05));
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.3, ctx.currentTime);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          noise.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start();
        } catch (e) {}
      }, [getContext]);

      const playCrunch = useCallback(() => {
        const ctx = getContext();
        if (!ctx) return;
        try {
          const bufferSize = ctx.sampleRate * 0.15;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 1500;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start();
        } catch (e) {}
      }, [getContext]);

      return { muted, setMuted, playPop, playTick, playPressureStart, playReveal, playDrainTwist, playSlide, playCrash, playCrunch };

      const [isRevealed, setIsRevealed] = useState(false);
      const [completedScenarios, setCompletedScenarios] = useState({});

      const [pressureModalOpen, setPressureModalOpen] = useState(false);
      const [pressureTimeLeft, setPressureTimeLeft] = useState(10);

      const [twistTriggered, setTwistTriggered] = useState(false);
      const [preTwistSocietyScore, setPreTwistSocietyScore] = useState(50);

      const currentScenario = SCENARIOS[currentScenarioIdx];

      useEffect(() => {
        if (!pressureModalOpen || pressureTimeLeft <= 0) return;
        const timer = setTimeout(() => {
          playTick(pressureTimeLeft <= 4);
          setPressureTimeLeft((prev) => prev - 1);
        }, 1000);
        return () => clearTimeout(timer);
      }, [pressureModalOpen, pressureTimeLeft, playTick]);

      const goToScenario = (index) => {
        setCurrentScenarioIdx(index);
        setSelectedChoice(null);
        setIsRevealed(false);
        setLastDelta(null);
        setPressureModalOpen(false);
        setScreen('scenario');
        setTeams((prev) => prev.map((t) => ({ ...t, currentPick: null })));
      };

      const handleSelectChoice = (letter) => {
        if (isRevealed) return;
        setSelectedChoice(letter);
        playPop();
      };

      const handleTeamPick = (teamId, letter) => {
        if (isRevealed) return;
        setTeams((prev) => prev.map((t) => (t.id === teamId ? { ...t, currentPick: letter } : t)));
        if (!selectedChoice) setSelectedChoice(letter);
        playPop();
      };

      const handleStartPressureTest = () => {
        if (!selectedChoice) return;
        setPressureTimeLeft(10);
        setPressureModalOpen(true);
        playPressureStart();
      };

      const handleRevealImpact = () => {
        if (!selectedChoice || isRevealed) return;
        const choiceObj = currentScenario.choices.find((c) => c.letter === selectedChoice);
        if (!choiceObj) return;

        setPressureModalOpen(false);
        setIsRevealed(true);

        const newSoc = Math.max(0, Math.min(100, societyScore + choiceObj.socDelta));
        const newGod = Math.max(0, Math.min(100, godScore + choiceObj.godDelta));

        setSocietyScore(newSoc);
        setGodScore(newGod);
        setLastDelta({ soc: choiceObj.socDelta, god: choiceObj.godDelta });

        setTeams((prev) =>
          prev.map((t) => {
            const pickLetter = t.currentPick || selectedChoice;
            const pickObj = currentScenario.choices.find((c) => c.letter === pickLetter);
            if (!pickObj) return t;
            return {
              ...t,
              soc: Math.max(0, Math.min(100, t.soc + pickObj.socDelta)),
              god: Math.max(0, Math.min(100, t.god + pickObj.godDelta))
            };
          })
        );

        setCompletedScenarios((prev) => ({ ...prev, [currentScenario.id]: selectedChoice }));
        playReveal(choiceObj.godDelta);
      };

      const handleTriggerHighSchoolTwist = () => {
        setPreTwistSocietyScore(societyScore);
        setTwistTriggered(true);
        setSocietyScore(0);
        setTeams((prev) => prev.map((t) => ({ ...t, soc: 0 })));
        playDrainTwist();
      };

      const handleFullReset = () => {
        setSocietyScore(50);
        setGodScore(50);
        setLastDelta(null);
        setSelectedChoice(null);
        setIsRevealed(false);
        setCompletedScenarios({});
        setTwistTriggered(false);
        setCurrentScenarioIdx(0);
        setScreen('scenario');
        setTeams([
          { id: 1, name: 'Équipe 1', soc: 50, god: 50, currentPick: null },
          { id: 2, name: 'Équipe 2', soc: 50, god: 50, currentPick: null },
          { id: 3, name: 'Équipe 3', soc: 50, god: 50, currentPick: null }
        ]);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-slate-950 pb-8">
          {/* HEADER */}
          <header className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 shadow-2xl">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 shrink-0">
                    <CopticCrossIcon className="w-6 h-6" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="font-black tracking-tight text-base sm:text-lg text-white">CHRÉTIEN 24/7</h1>
                      <span className="text-[11px] font-bold uppercase px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30 hidden sm:inline-block">
                        Société
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 hidden sm:block">Le Dilemme des 2 Jauges • Journée Copte Orthodoxe</p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-1.5">
                  {SCENARIOS.map((scen, idx) => {
                    const isDone = Boolean(completedScenarios[scen.id]);
                    const isActive = screen === 'scenario' && currentScenarioIdx === idx;
                    return (
                      <button
                        key={scen.id}
                        onClick={() => goToScenario(idx)}
                        className={`px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer ${
                          isActive ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/25'
                            : isDone ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-600/50 hover:bg-emerald-900/60'
                            : 'bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800'
                        }`}
                      >
                        {isDone && <CheckCircle2 className="w-3.5 h-3.5 text-emerald-400" />}
                        <span className="hidden sm:inline">{scen.shortLabel}</span>
                        <span className="sm:hidden">{scen.id}</span>
                      </button>
                    );
                  })}

                  <button
                    onClick={() => setScreen('twist')}
                    className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 cursor-pointer ${
                      screen === 'twist' ? 'bg-gradient-to-r from-rose-500 to-amber-500 text-slate-950 shadow-lg'
                        : 'bg-gradient-to-r from-indigo-900/80 to-purple-900/80 border border-purple-500/50 text-purple-200 hover:border-purple-400'
                    }`}
                  >
                    <Zap className="w-3.5 h-3.5 text-amber-300" />
                    <span className="hidden sm:inline">Plot Twist Final</span>
                  </button>

                  <div className="h-5 w-px bg-slate-800 mx-1 hidden sm:block" />

                  <button onClick={() => setShowTeamsBar(!showTeamsBar)} className={`p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-1 cursor-pointer ${showTeamsBar ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'}`} title="Suivi Équipes">
                    <Users className="w-4 h-4 sm:w-3.5 sm:h-3.5" />
                    <span className="hidden md:inline">3 Équipes</span>
                  </button>

                  <button onClick={() => setMuted(!muted)} className="p-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white transition cursor-pointer" title="Son">
                    {muted ? <VolumeX className="w-4 h-4 text-rose-400" /> : <Volume2 className="w-4 h-4 text-emerald-400" />}
                  </button>

                  <button onClick={handleFullReset} className="p-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-300 transition cursor-pointer" title="Reset">
                    <RotateCcw className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 sm:gap-4">
                {/* JAUGE SOCIÉTÉ */}
                <div className={`rounded-2xl p-2.5 sm:p-3 border transition-all duration-500 relative overflow-hidden ${twistTriggered ? 'bg-rose-950/30 border-rose-500/60' : 'bg-slate-900/90 border-cyan-500/40 shadow-lg shadow-cyan-950/30'}`}>
                  <div className="flex items-center justify-between mb-1.5">
                    <div className="flex items-center gap-2">
                      <span className="text-lg sm:text-xl">😎</span>
                      <div>
                        <span className="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-cyan-300 block">Jauge SOCIÉTÉ</span>
                        <span className="text-[11px] text-slate-400 hidden sm:block">{twistTriggered ? '⚠️ Vidée au passage au Lycée' : 'Réputation & confort social'}</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {lastDelta && lastDelta.soc !== 0 && !twistTriggered && (

                          <span className="text-amber-300 font-bold">🔥 {t.god}</span>

                      {screen === 'scenario' && (
                        <div className="flex items-center gap-1">

                            <button
                              key={c.letter}
                              disabled={isRevealed}
                              onClick={() => handleTeamPick(t.id, c.letter)}
                              className={`w-6 h-6 rounded-lg text-xs font-extrabold transition cursor-pointer ${t.currentPick === c.letter ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                            >
                              {c.letter}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </header>

          {/* MAIN BODY */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5">
            {screen === 'scenario' ? (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-5">
                  <div className="space-y-1">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-extrabold uppercase tracking-wider">
                      <span>{currentScenario.shortLabel}</span><span>•</span><span>{currentScenario.badge}</span>
                    </div>
                    <h2 className="text-xl sm:text-3xl font-black text-white tracking-tight">{currentScenario.title}</h2>
                    <p className="text-sm sm:text-base text-slate-300">{currentScenario.contextSummary}</p>
                  </div>

                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      disabled={currentScenarioIdx === 0}
                      onClick={() => goToScenario(currentScenarioIdx - 1)}
                      className="p-2.5 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 disabled:opacity-40 cursor-pointer"
                    >
                      <ChevronLeft className="w-5 h-5" />
                    </button>
                    {currentScenarioIdx < SCENARIOS.length - 1 ? (
                      <button onClick={() => goToScenario(currentScenarioIdx + 1)} className="px-4 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer">
                        <span>Scénario suivant</span>
                        <ChevronRight className="w-4 h-4" />
                      </button>
                    ) : (
                      <button onClick={() => setScreen('twist')} className="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-xs sm:text-sm flex items-center gap-1.5 shadow-lg cursor-pointer">
                        <Zap className="w-4 h-4" />
                        <span>Passage au Lycée</span>
                      </button>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  {/* LEFT COL : SIMULATOR */}
                  <div className="lg:col-span-5 space-y-4">
                    {currentScenario.simulatorType === 'snapchat' && <SnapchatSimulator playPop={playPop} />}
                    {currentScenario.simulatorType === 'exam' && <ExamLeakSimulator playSlide={playSlide} />}
                    {currentScenario.simulatorType === 'agenda' && <SundayAgendaSimulator playCrash={playCrash} />}
                    {currentScenario.simulatorType === 'brownie' && <BrownieSimulator playCrunch={playCrunch} />}

                    <div className="rounded-2xl bg-slate-900/70 border border-slate-800/90 p-3.5 text-xs text-slate-300 flex items-start gap-3">
                      <div className="p-2 rounded-xl bg-amber-500/15 text-amber-300 shrink-0">
                        <Sparkles className="w-4 h-4" />
                      </div>
                      <div>
                        <span className="font-bold text-white block mb-0.5">Mécanique en salle : Votez puis résistez !</span>
                        Clique sur le choix voté par les jeunes (A, B, C ou D). Avant de révéler, lance le <strong>Test de Pression (10s)</strong> pour voir qui craque !
                      </div>
                    </div>
                  </div>

                  {/* RIGHT COL : CHOICES */}
                  <div className="lg:col-span-7 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="font-extrabold text-sm sm:text-base uppercase tracking-wider text-slate-300 flex items-center gap-2">
                        <span>🎯 Les Choix</span>
                        {!isRevealed && <span className="text-xs font-normal text-slate-400 hidden sm:inline">(Points cachés)</span>}
                      </h3>
                      {selectedChoice && !isRevealed && (
                        <span className="text-xs font-bold text-amber-300 bg-amber-500/15 border border-amber-500/30 px-2.5 py-1 rounded-full">

                        </span>

                    </div>

                    <div className="grid grid-cols-1 gap-3">
                      {currentScenario.choices.map((choice) => {
                        const isSelected = selectedChoice === choice.letter;
                        const isHeroChoice = choice.verdictType === 'hero';

                        return (
                          <div
                            key={choice.letter}
                            onClick={() => handleSelectChoice(choice.letter)}
                            className={`rounded-2xl p-4 border-2 transition-all duration-300 cursor-pointer relative ${
                              isRevealed ? (isHeroChoice ? 'bg-emerald-950/40 border-emerald-500 shadow-lg' : isSelected ? 'bg-rose-950/40 border-rose-500' : 'bg-slate-900/70 border-slate-800 opacity-85')
                                : isSelected ? 'bg-amber-500/15 border-amber-400 shadow-xl scale-[1.01]' : 'bg-slate-900/90 border-slate-800 hover:border-slate-600'
                            }`}
                          >
                            <div className="flex items-start gap-3.5">
                              <div className={`w-10 h-10 sm:w-11 sm:h-11 rounded-2xl font-black text-lg flex items-center justify-center shrink-0 transition ${
                                isRevealed ? (isHeroChoice ? 'bg-emerald-500 text-slate-950' : isSelected ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300')
                                  : isSelected ? 'bg-amber-400 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300'
                              }`}>
                                {choice.letter}
                              </div>

                              <div className="flex-1 space-y-2">
                                <p className="text-sm sm:text-base font-semibold text-white leading-snug">{choice.text}</p>
                                {isRevealed && (
                                  <div className="pt-2 border-t border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2 animate-fadeIn">
                                    <div className="space-y-0.5">
                                      <span className={`text-xs font-extrabold uppercase tracking-wider block ${isHeroChoice ? 'text-emerald-400' : choice.verdictType === 'partial' ? 'text-amber-300' : 'text-rose-400'}`}>
                                        {isHeroChoice ? '✅ ' : '⚠️ '}{choice.verdictTitle}
                                      </span>
                                      <p className="text-xs sm:text-sm text-slate-300">{choice.explanation}</p>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                      <span className={`px-2.5 py-1 rounded-xl text-xs font-black border ${choice.socDelta >= 0 ? 'bg-cyan-500/15 border-cyan-500/40 text-cyan-300' : 'bg-rose-500/15 border-rose-500/40 text-rose-300'}`}>

                                      </span>
                                      <span className={`px-2.5 py-1 rounded-xl text-xs font-black border ${choice.godDelta >= 0 ? 'bg-amber-500/20 border-amber-400/60 text-amber-300' : 'bg-rose-500/15 border-rose-500/40 text-rose-300'}`}>

                              <span>Passer au {SCENARIOS[currentScenarioIdx + 1].shortLabel}</span>
                              <ChevronRight className="w-4 h-4" />
                            </button>
                          ) : (
                            <button onClick={() => setScreen('twist')} className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-amber-400 text-slate-950 font-black text-sm flex items-center gap-2 shadow-lg cursor-pointer transition">
                              <Zap className="w-4 h-4" />
                              <span>Découvrir le Plot Twist Final</span>
                            </button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ) : (
              /* ÉCRAN FINAL (PLOT TWIST) */
              <div className="max-w-4xl mx-auto space-y-6 py-2">
                <div className="rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950/60 to-slate-950 border-2 border-slate-800 p-6 sm:p-8 text-center space-y-6 shadow-2xl animate-fadeIn">
                  <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-purple-500/15 border border-purple-500/40 text-purple-300 text-xs font-black uppercase tracking-widest">
                    <GraduationCap className="w-4 h-4" /><span>Le Bilan Final</span>
                  </div>

                  <h2 className="text-2xl sm:text-4xl font-black text-white tracking-tight">
                    {twistTriggered ? '💥 Ta Jauge de Popularité est retombée à ZÉRO !' : 'Et maintenant… avançons le temps de 3 ans !'}
                  </h2>

                  {!twistTriggered ? (
                    <p className="text-slate-300 text-base sm:text-lg max-w-2xl mx-auto">
                      Vous avez terminé les scénarios avec <span className="text-cyan-300 font-black">{societyScore}/100</span> en Société et <span className="text-amber-300 font-black">{godScore}/100</span> avec Dieu. Mais que se passe-t-il quand vous changez de classe et arrivez au Lycée ?
                    </p>
                  ) : (
                    <div className="rounded-2xl bg-rose-950/40 border-2 border-rose-500/60 p-5 max-w-2xl mx-auto text-left space-y-2 animate-fadeIn">
                      <p className="text-white font-bold text-base sm:text-lg leading-relaxed">
                        Pourquoi la <span className="text-cyan-300">Jauge SOCIÉTÉ</span> est passée de <span className="line-through text-rose-400">{preTwistSocietyScore}/100</span> à <span className="text-rose-400 font-black">0/100</span> ?
                      </p>
                      <p className="text-slate-200 text-sm sm:text-base leading-relaxed">
                        Parce qu’au lycée, les classes changent. Les camarades pour qui tu aurais triché ou menti ne seront même plus là. <strong>Ta popularité repart à zéro</strong>.
                      </p>
                      <p className="text-amber-300 font-bold text-sm sm:text-base pt-1">
                        🔥 En revanche, ta Jauge DIEU ({godScore}/100) — ton intégrité, ta vérité — personne ne pourra l’effacer. (Matthieu 7, 24).
                      </p>
                    </div>
                  )}

                  {!twistTriggered && (
                    <div className="pt-2">
                      <button onClick={handleTriggerHighSchoolTwist} className="px-7 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 via-purple-500 to-rose-500 hover:scale-105 text-white font-black text-base sm:text-lg inline-flex items-center gap-3 shadow-2xl shadow-purple-500/30 transition cursor-pointer">
                        <GraduationCap className="w-6 h-6" /><span>🎓 Avancer le temps (Entrée au Lycée)</span>
                      </button>
                    </div>
                  )}
                </div>

                <div className="space-y-3">
                  <h3 className="font-black text-center text-sm sm:text-base uppercase tracking-widest text-amber-300">
                    🌟 Les 3 Leçons de Vie à emporter
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {SCENARIOS.slice(0, 3).map((scen, idx) => (
                      <div key={scen.id} className="rounded-3xl bg-slate-900 border-2 border-amber-500/40 p-5 flex flex-col justify-between space-y-3 shadow-xl">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-black uppercase px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300">Leçon #{idx + 1}</span>
                            <CopticCrossIcon className="w-5 h-5 text-amber-400" />
                          </div>
                          <h4 className="font-black text-white text-base">{scen.heroCard.name}</h4>
                          <p className="text-amber-300 font-extrabold text-sm leading-snug">{scen.heroCard.lessonQuote}</p>
                        </div>
                        <p className="text-xs text-slate-400 border-t border-slate-800 pt-2">{scen.heroCard.shortPunchline}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* PRESSURE MODAL (10s) */}
          {pressureModalOpen && selectedChoice && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="max-w-xl w-full rounded-3xl bg-slate-900 border-2 border-rose-500 p-6 shadow-2xl space-y-5 animate-fadeIn">
                <div className="flex items-center justify-between">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-black uppercase tracking-wider">
                    <Flame className="w-4 h-4 text-rose-400" />
                    <span>Test de Résistance</span>
                  </div>
                  <div className={`px-3.5 py-1.5 rounded-2xl font-black text-lg tabular-nums flex items-center gap-1.5 ${pressureTimeLeft <= 3 ? 'bg-rose-600 text-white animate-pulse' : 'bg-slate-800 text-amber-300'}`}>
                    <Timer className="w-4 h-4" /><span>{pressureTimeLeft}s</span>
                  </div>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Vous avez choisi l’option {selectedChoice}… Mais on vous murmure :
                  </span>
                  <div className="rounded-2xl bg-rose-950/50 border border-rose-500/50 p-4">
                    <p className="text-base sm:text-lg font-extrabold text-white leading-relaxed">
                      {currentScenario.pressurePrompts[selectedChoice]}
                    </p>
                  </div>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-300 block">Qui garde son choix ? Qui change d’option ?</span>
                  <div className="grid grid-cols-4 gap-2">
                    {currentScenario.choices.map((c) => (
                      <button
                        key={c.letter}
                        onClick={() => handleSelectChoice(c.letter)}
                        className={`py-2.5 rounded-xl font-black text-sm border transition cursor-pointer ${selectedChoice === c.letter ? 'bg-amber-400 text-slate-950 border-amber-300 shadow-lg' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                      >
                        {c.letter}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                  <button onClick={() => setPressureModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold cursor-pointer">
                    Fermer
                  </button>
                  <button onClick={handleRevealImpact} className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black text-xs sm:text-sm flex items-center gap-1.5 shadow-lg cursor-pointer">
                    <Eye className="w-4 h-4" />
                    <span>On tient bon ! Révéler</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
